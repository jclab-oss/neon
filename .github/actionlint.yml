self-hosted-runner:
  labels:
    - arm64
    - large
    - large-arm64
    - small
    - small-metal
    - small-arm64
    - unit-perf
    - unit-perf-aws-arm
    - us-east-2
config-variables:
  - AWS_ECR_REGION
  - AZURE_DEV_CLIENT_ID
  - AZURE_DEV_REGISTRY_NAME
  - AZURE_DEV_SUBSCRIPTION_ID
  - AZURE_PROD_CLIENT_ID
  - AZURE_PROD_REGISTRY_NAME
  - AZURE_PROD_SUBSCRIPTION_ID
  - AZURE_TENANT_ID
  - BENCHMARK_INGEST_TARGET_PROJECTID
  - BENCHMARK_LARGE_OLTP_PROJECTID
  - BENCHMARK_PROJECT_ID_PUB
  - BENCHMARK_PROJECT_ID_SUB
  - DEV_AWS_OIDC_ROLE_ARN
  - DEV_AWS_OIDC_ROLE_MANAGE_BENCHMARK_EC2_VMS_ARN
  # Registry for BuildKit's layer cache, and for the VM compute images of PR runs, instead of GHCR, e.g.
  # `asia-northeast3-docker.pkg.dev/<project>/<repository>`: a Google Artifact Registry repository in the self-hosted
  # runners' region, which they log in to with their GCE VM's service account (see the docker-cache-registry action).
  # GHCR when unset.
  - DOCKER_CACHE_REGISTRY
  - HETZNER_CACHE_BUCKET
  - HETZNER_CACHE_ENDPOINT
  - HETZNER_CACHE_REGION
  # The pageserver's O_DIRECT buffer alignment (`512` or `4k`) Build and Test builds the neon image and the
  # tests with, for runners whose disk has 4096-byte logical sectors; upstream's `512` when unset.
  - IO_ALIGNMENT
  - NEON_DEV_AWS_ACCOUNT_ID
  - NEON_PROD_AWS_ACCOUNT_ID
  # Postgres versions Build and Test builds compute images for and runs the per-version tests on, e.g.
  # `v16,v17`; all of them when unset. A manual run's `pg-versions` input takes precedence.
  - PG_VERSIONS
  - PGREGRESS_PG16_PROJECT_ID
  - PGREGRESS_PG17_PROJECT_ID
  - PREWARM_PROJECT_ID
  - REMOTE_STORAGE_AZURE_CONTAINER
  - REMOTE_STORAGE_AZURE_REGION
  # This fork's replacements for upstream's self-hosted runner labels (`small`, `small-arm64`, `large`,
  # `large-arm64`, `large-metal`); each defaults to a GitHub-hosted runner when unset. The value is either a
  # single runner label (`github-ubuntu-2404-x64-8x`) or a JSON array of labels the runner must all have
  # (`["self-hosted", "linux", "x64"]`), as `runs-on` accepts.
  - RUNNER_LARGE
  - RUNNER_LARGE_ARM64
  - RUNNER_LARGE_METAL
  - RUNNER_SMALL
  - RUNNER_SMALL_ARM64
  - SLACK_CICD_CHANNEL_ID
  - SLACK_COMPUTE_CHANNEL_ID
  - SLACK_ON_CALL_DEVPROD_STREAM
  - SLACK_ON_CALL_QA_STAGING_STREAM
  - SLACK_ON_CALL_STORAGE_STAGING_STREAM
  - SLACK_ONCALL_COMPUTE_GROUP
  - SLACK_ONCALL_PROXY_GROUP
  - SLACK_ONCALL_STORAGE_GROUP
  - SLACK_PROXY_CHANNEL_ID
  - SLACK_RUST_CHANNEL_ID
  - SLACK_STORAGE_CHANNEL_ID
  - SLACK_UPCOMING_RELEASE_CHANNEL_ID
