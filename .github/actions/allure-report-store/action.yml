name: 'Store Allure results'
description: 'Upload test results to be used by actions/allure-report-generate'

inputs:
  report-dir:
    description: 'directory with test results generated by tests'
    required: true
  unique-key:
    description: 'string to distinguish different results in the same run'
    required: true
  aws-oidc-role-arn:
    # Unused: this fork has no access to AWS/S3. Kept so that callers passing it stay valid
    # description: 'OIDC role arn to interract with S3'
    # required: true
    required: false
    default: ''

runs:
  using: "composite"

  steps:
    - name: Set variables
      shell: bash -euxo pipefail {0}
      env:
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPORT_DIR: ${{ inputs.report-dir }}
      run: |
        if [ -n "${PR_NUMBER}" ]; then
          BRANCH_OR_PR=pr-${PR_NUMBER}
        elif [ "${GITHUB_REF_NAME}" = "main" ] || [ "${GITHUB_REF_NAME}" = "release" ] || \
             [ "${GITHUB_REF_NAME}" = "release-proxy" ] || [ "${GITHUB_REF_NAME}" = "release-compute" ]; then
          # Shortcut for special branches
          BRANCH_OR_PR=${GITHUB_REF_NAME}
        else
          BRANCH_OR_PR=branch-$(printf "${GITHUB_REF_NAME}" | tr -c "[:alnum:]._-" "-")
        fi

        echo "BRANCH_OR_PR=${BRANCH_OR_PR}" >> $GITHUB_ENV
        echo "REPORT_DIR=${REPORT_DIR}"     >> $GITHUB_ENV

    # This fork has no access to Neon's S3 bucket, so the raw results are stored as a GitHub Actions
    # artifact of the current run (`allure-results-*`), which `allure-report-generate` collects:
    # this step only prepares the archive, and the next one uploads it.
    # - uses: aws-actions/configure-aws-credentials@v4
    #   if: ${{ !cancelled() }}
    #   with:
    #     aws-region: eu-central-1
    #     role-to-assume: ${{ inputs.aws-oidc-role-arn }}
    #     role-duration-seconds: 3600 # 1 hour should be more than enough to upload report
    #
    # - name: Upload test results
    - name: Prepare test results
      id: prepare
      shell: bash -euxo pipefail {0}
      # The S3 report/raw prefixes and the report URLs in executor.json below pointed into Neon's bucket:
      #   REPORT_PREFIX=reports/${BRANCH_OR_PR}
      #   RAW_PREFIX=reports-raw/${BRANCH_OR_PR}/${GITHUB_RUN_ID}
      #   "url": "https://${BUCKET}.s3.amazonaws.com/${REPORT_PREFIX}/latest/index.html",
      #   "reportUrl": "https://${BUCKET}.s3.amazonaws.com/${REPORT_PREFIX}/${GITHUB_RUN_ID}/index.html",
      run: |
        # Add metadata
        cat <<EOF > ${REPORT_DIR}/executor.json
          {
            "name": "GitHub Actions",
            "type": "github",
            "buildOrder": ${GITHUB_RUN_ID},
            "buildName": "GitHub Actions Run #${GITHUB_RUN_NUMBER}/${GITHUB_RUN_ATTEMPT}",
            "buildUrl": "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}",
            "reportName": "Allure Report"
          }
        EOF

        cat <<EOF > ${REPORT_DIR}/environment.properties
          COMMIT_SHA=${COMMIT_SHA}
        EOF

        # The unique key alone is not unique across matrix jobs (e.g. with and without LFC),
        # so keep the timestamp suffix upstream uses for its S3 object names; the archive is
        # uploaded as an artifact by the next step instead of being moved to S3.
        # ARCHIVE="${UNIQUE_KEY}-${GITHUB_RUN_ATTEMPT}-$(date +%s).tar.zst"
        ARCHIVE_NAME="${UNIQUE_KEY}-${GITHUB_RUN_ATTEMPT}-$(date +%s%N)"
        ARCHIVE="/tmp/allure-results-${ARCHIVE_NAME}.tar.zst"
        ZSTD_NBTHREADS=0

        time tar -C ${REPORT_DIR} -cf ${ARCHIVE} --zstd .
        # time aws s3 mv --only-show-errors ${ARCHIVE} "s3://${BUCKET}/${RAW_PREFIX}/${ARCHIVE}"
        echo "archive=${ARCHIVE}"           >> $GITHUB_OUTPUT
        echo "archive-name=${ARCHIVE_NAME}" >> $GITHUB_OUTPUT
      env:
        UNIQUE_KEY: ${{ inputs.unique-key }}
        COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        # No S3 bucket, see above
        # BUCKET: neon-github-public-dev

    - name: Upload test results
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: allure-results-${{ steps.prepare.outputs.archive-name }}
        path: ${{ steps.prepare.outputs.archive }}
        compression-level: 0

    - name: Cleanup
      if: always()
      shell: bash -euxo pipefail {0}
      run: |
        rm -rf ${REPORT_DIR}
        rm -f /tmp/allure-results-*.tar.zst
