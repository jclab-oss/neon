    #
    #     # Generate redirect
    #     cat <<EOF > ${WORKDIR}/index.html
    #       <!DOCTYPE html>
    #
    #       <meta charset="utf-8">
    #       <title>Redirecting to ${REPORT_URL}</title>
    #       <meta http-equiv="refresh" content="0; URL=${REPORT_URL}">
    #     EOF
    #     time aws s3 cp --only-show-errors ${WORKDIR}/index.html "s3://${BUCKET}/${REPORT_PREFIX}/latest/index.html"
    #
    #     echo "base-url=${BASE_URL}"               >> $GITHUB_OUTPUT
    #     echo "base-s3-url=${BASE_S3_URL}"         >> $GITHUB_OUTPUT
    #     echo "report-url=${REPORT_URL}"           >> $GITHUB_OUTPUT
    #     echo "report-json-url=${REPORT_JSON_URL}" >> $GITHUB_OUTPUT
    #
    #     echo "[Allure Report](${REPORT_URL})" >> ${GITHUB_STEP_SUMMARY}

    - name: Generate Allure report
      id: generate-report
      shell: bash -euxo pipefail {0}
      run: |
        ZSTD_NBTHREADS=0

        if [ -z "$(find ${WORKDIR} -name '*.tar.zst')" ]; then
          # There're no test results uploaded in this run
          exit 0
        fi

        for archive in $(find ${WORKDIR} -name "*.tar.zst"); do
          mkdir -p ${archive%.tar.zst}
          time tar -xf ${archive} -C ${archive%.tar.zst}
          rm -f ${archive}
        done

        # Generate report
        time allure generate --clean --output ${WORKDIR}/report ${WORKDIR}/*

        # Keep the JSON outside of WORKDIR (which is cleaned up below) for the steps that summarise it
        REPORT_JSON=/tmp/allure-report-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-suites.json
        cp ${WORKDIR}/report/data/suites.json ${REPORT_JSON}

        echo "report-dir=${WORKDIR}/report"   >> $GITHUB_OUTPUT
        echo "report-json-url=${REPORT_JSON}" >> $GITHUB_OUTPUT

    - name: Upload Allure report
      id: upload-report
      if: steps.generate-report.outputs.report-dir != ''
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: allure-report
        path: ${{ steps.generate-report.outputs.report-dir }}
        overwrite: true

    # No S3 lock to release
    # - name: Release lock
    #   if: always()
    #   shell: bash -euxo pipefail {0}
    #   run: |
    #     aws s3 cp --only-show-errors "s3://${BUCKET}/${LOCK_FILE}" ./lock.txt || exit 0
    #
    #     if [ "$(cat lock.txt)" = "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" ]; then
    #       aws s3 rm "s3://${BUCKET}/${LOCK_FILE}"
    #     fi

    - name: Add report link to the summary
      if: steps.upload-report.outputs.artifact-url != ''
      shell: bash -euxo pipefail {0}
      env:
        REPORT_URL: ${{ steps.upload-report.outputs.artifact-url }}
      run: |
        echo "[Allure Report](${REPORT_URL})" >> ${GITHUB_STEP_SUMMARY}

    - name: Cache poetry deps
      uses: actions/cache@v4
      with:
        path: ~/.cache/pypoetry/virtualenvs
        key: v2-${{ runner.os }}-${{ runner.arch }}-python-deps-bookworm-${{ hashFiles('poetry.lock') }}

    - name: Store Allure test stat in the DB (new)
      if: ${{ !cancelled() && inputs.store-test-results-into-db == 'true' }}
      shell: bash -euxo pipefail {0}
      env:
        COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        # The report isn't in S3 (and this step doesn't use it)
        # BASE_S3_URL: ${{ steps.generate-report.outputs.base-s3-url }}
      run: |
        if [ ! -d "${WORKDIR}/report/data/test-cases" ]; then
          exit 0
        fi

        export DATABASE_URL=${REGRESS_TEST_RESULT_CONNSTR_NEW}

        ./scripts/pysync

        poetry run python3 scripts/ingest_regress_test_result-new-format.py \
          --reference ${GITHUB_REF} \
          --revision ${COMMIT_SHA} \
          --run-id ${GITHUB_RUN_ID} \
          --run-attempt ${GITHUB_RUN_ATTEMPT} \
          --test-cases-dir ${WORKDIR}/report/data/test-cases

    - name: Cleanup
      if: always()
      shell: bash -euxo pipefail {0}
      run: |
        if [ -d "${WORKDIR}" ]; then
          rm -rf ${WORKDIR}
        fi

    - uses: actions/github-script@v7
      if: always()
      env:
        # The report is the `allure-report` artifact
        # REPORT_URL: ${{ steps.generate-report.outputs.report-url }}
        REPORT_URL: ${{ steps.upload-report.outputs.artifact-url }}
        COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      with:
        # Retry script for 5XX server errors: https://github.com/actions/github-script#retries
        retries: 5
        script: |
          const { REPORT_URL, COMMIT_SHA } = process.env

          await github.rest.repos.createCommitStatus({
            owner: context.repo.owner,
            repo: context.repo.repo,
            sha: `${COMMIT_SHA}`,
            state: 'success',
            target_url: `${REPORT_URL}`,
            context: 'Allure report',
          })
