name: 'Create Allure report'
description: 'Generate Allure report from uploaded by actions/allure-report-store tests results'

inputs:
  store-test-results-into-db:
    description: 'Whether to store test results into the database. TEST_RESULT_CONNSTR/TEST_RESULT_CONNSTR_NEW should be set'
    type: boolean
    required: false
    default: false
  aws-oidc-role-arn:
    description: 'Unused: this fork has no access to AWS/S3. Kept so that callers passing it stay valid'
    required: false
    default: ''

outputs:
  report-url:
    description: 'Allure report URL (a GitHub Actions artifact of the current run)'
    value: ${{ steps.upload-report.outputs.artifact-url }}
  report-json-url:
    description: 'Local path to the Allure report JSON (data/suites.json), readable by the following steps of the job'
    value: ${{ steps.generate-report.outputs.report-json-url }}

runs:
  using: "composite"

  steps:
    # We're using some of env variables quite offen, so let's set them once.
    #
    # It would be nice to have them set in common runs.env[0] section, but it doesn't work[1]
    #
    # - [0] https://docs.github.com/en/actions/creating-actions/metadata-syntax-for-github-actions#runsenv
    # - [1] https://github.com/neondatabase/neon/pull/3907#discussion_r1154703456
    #
    - name: Set variables
      shell: bash -euxo pipefail {0}
      env:
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        if [ -n "${PR_NUMBER}" ]; then
          BRANCH_OR_PR=pr-${PR_NUMBER}
        elif [ "${GITHUB_REF_NAME}" = "main" ] || [ "${GITHUB_REF_NAME}" = "release" ] || \
             [ "${GITHUB_REF_NAME}" = "release-proxy" ] || [ "${GITHUB_REF_NAME}" = "release-compute" ]; then
          # Shortcut for special branches
          BRANCH_OR_PR=${GITHUB_REF_NAME}
        else
          BRANCH_OR_PR=branch-$(printf "${GITHUB_REF_NAME}" | tr -c "[:alnum:]._-" "-")
        fi

        WORKDIR=/tmp/${BRANCH_OR_PR}-$(date +%s)
        mkdir -p ${WORKDIR}

        echo "BRANCH_OR_PR=${BRANCH_OR_PR}" >> $GITHUB_ENV
        echo "WORKDIR=${WORKDIR}"           >> $GITHUB_ENV

    # TODO: We can replace with a special docker image with Java and Allure pre-installed
    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Allure
      shell: bash -euxo pipefail {0}
      working-directory: /tmp
      run: |
        if ! which allure; then
          ALLURE_ZIP=allure-${ALLURE_VERSION}.zip
          wget -q https://github.com/allure-framework/allure2/releases/download/${ALLURE_VERSION}/${ALLURE_ZIP}
          echo "${ALLURE_ZIP_SHA256} ${ALLURE_ZIP}" | sha256sum --check
          unzip -q ${ALLURE_ZIP}
          echo "$(pwd)/allure-${ALLURE_VERSION}/bin" >> $GITHUB_PATH
          rm -f ${ALLURE_ZIP}
        fi
      env:
        ALLURE_VERSION: 2.32.2
        ALLURE_ZIP_SHA256: 3f28885e2118f6317c92f667eaddcc6491400af1fb9773c1f3797a5fa5174953

    # This fork has no access to Neon's S3 bucket: the raw results are collected from the
    # `allure-results-*` artifacts uploaded by `allure-report-store` in this run, and the report
    # itself is published as the `allure-report` artifact. There is no shared storage to keep a
    # history trend or a `latest` redirect in, so those (and the S3 lock guarding them) are dropped.
    - name: Download test results
      uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
      # There may be no results at all (e.g. when the tests were skipped)
      continue-on-error: true
      with:
        pattern: allure-results-*
        path: ${{ env.WORKDIR }}
        merge-multiple: true

    - name: Generate Allure report
      id: generate-report
      shell: bash -euxo pipefail {0}
      run: |
        ZSTD_NBTHREADS=0

        if [ -z "$(find ${WORKDIR} -name '*.tar.zst')" ]; then
          # There're no test results uploaded in this run
          exit 0
        fi

        for archive in $(find ${WORKDIR} -name "*.tar.zst"); do
          mkdir -p ${archive%.tar.zst}
          time tar -xf ${archive} -C ${archive%.tar.zst}
          rm -f ${archive}
        done

        # Generate report
        time allure generate --clean --output ${WORKDIR}/report ${WORKDIR}/*

        # Keep the JSON outside of WORKDIR (which is cleaned up below) for the steps that summarise it
        REPORT_JSON=/tmp/allure-report-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-suites.json
        cp ${WORKDIR}/report/data/suites.json ${REPORT_JSON}

        echo "report-dir=${WORKDIR}/report"   >> $GITHUB_OUTPUT
        echo "report-json-url=${REPORT_JSON}" >> $GITHUB_OUTPUT

    - name: Upload Allure report
      id: upload-report
      if: steps.generate-report.outputs.report-dir != ''
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: allure-report
        path: ${{ steps.generate-report.outputs.report-dir }}
        overwrite: true

    - name: Add report link to the summary
      if: steps.upload-report.outputs.artifact-url != ''
      shell: bash -euxo pipefail {0}
      env:
        REPORT_URL: ${{ steps.upload-report.outputs.artifact-url }}
      run: |
        echo "[Allure Report](${REPORT_URL})" >> ${GITHUB_STEP_SUMMARY}

    - name: Cache poetry deps
      uses: actions/cache@v4
      with:
        path: ~/.cache/pypoetry/virtualenvs
        key: v2-${{ runner.os }}-${{ runner.arch }}-python-deps-bookworm-${{ hashFiles('poetry.lock') }}

    - name: Store Allure test stat in the DB (new)
      if: ${{ !cancelled() && inputs.store-test-results-into-db == 'true' }}
      shell: bash -euxo pipefail {0}
      env:
        COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      run: |
        if [ ! -d "${WORKDIR}/report/data/test-cases" ]; then
          exit 0
        fi

        export DATABASE_URL=${REGRESS_TEST_RESULT_CONNSTR_NEW}

        ./scripts/pysync

        poetry run python3 scripts/ingest_regress_test_result-new-format.py \
          --reference ${GITHUB_REF} \
          --revision ${COMMIT_SHA} \
          --run-id ${GITHUB_RUN_ID} \
          --run-attempt ${GITHUB_RUN_ATTEMPT} \
          --test-cases-dir ${WORKDIR}/report/data/test-cases

    - name: Cleanup
      if: always()
      shell: bash -euxo pipefail {0}
      run: |
        if [ -d "${WORKDIR}" ]; then
          rm -rf ${WORKDIR}
        fi

    - uses: actions/github-script@v7
      if: always()
      env:
        REPORT_URL: ${{ steps.upload-report.outputs.artifact-url }}
        COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      with:
        # Retry script for 5XX server errors: https://github.com/actions/github-script#retries
        retries: 5
        script: |
          const { REPORT_URL, COMMIT_SHA } = process.env

          await github.rest.repos.createCommitStatus({
            owner: context.repo.owner,
            repo: context.repo.repo,
            sha: `${COMMIT_SHA}`,
            state: 'success',
            target_url: `${REPORT_URL}`,
            context: 'Allure report',
          })
