name: "Download an artifact"
description: "Custom download action"
inputs:
  name:
    description: "Artifact name"
    required: true
  path:
    description: "A directory to put artifact into"
    default: "."
    required: false
  skip-if-does-not-exist:
    description: "Allow to skip if file doesn't exist, fail otherwise"
    default: false
    required: false
  prefix:
    description: >
      S3 prefix upstream uses to fetch artifacts of *other* runs (e.g. `latest` for the previous release).
      Artifacts are GitHub Actions artifacts of the current run here, so when a prefix is given the artifact
      is treated as missing (see `skip-if-does-not-exist`).
    required: false
  aws-oidc-role-arn:
    description: 'Unused: this fork has no access to AWS/S3. Kept so that callers passing it stay valid'
    required: false
    default: ''

runs:
  using: "composite"
  steps:
    # This fork has no access to Neon's S3 bucket; artifacts are GitHub Actions artifacts of the
    # current run (see the `upload` action), which contain a single `<name>.tar.zst`.
    - name: Download artifact
      id: download-artifact
      if: inputs.prefix == ''
      uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
      continue-on-error: ${{ format('{0}', inputs.skip-if-does-not-exist) == 'true' }}
      with:
        name: ${{ inputs.name }}
        path: /tmp/downloads

    - name: Extract artifact
      shell: bash -euxo pipefail {0}
      env:
        TARGET: ${{ inputs.path }}
        ARCHIVE: /tmp/downloads/${{ inputs.name }}.tar.zst
        SKIP_IF_DOES_NOT_EXIST: ${{ inputs.skip-if-does-not-exist }}
        NAME: ${{ inputs.name }}
        PREFIX: ${{ inputs.prefix }}
      run: |
        if [ ! -f ${ARCHIVE} ]; then
          if [ "${SKIP_IF_DOES_NOT_EXIST}" = "true" ]; then
            echo >&2 "Artifact ${NAME} (prefix '${PREFIX}') does not exist, skipping"
            exit 0
          else
            echo >&2 "Artifact ${NAME} (prefix '${PREFIX}') does not exist"
            exit 1
          fi
        fi

        mkdir -p ${TARGET}
        time tar -xf ${ARCHIVE} -C ${TARGET}
        rm -f ${ARCHIVE}
