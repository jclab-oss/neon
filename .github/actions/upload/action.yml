name: "Upload an artifact"
description: "Custom upload action"
inputs:
  name:
    description: "Artifact name"
    required: true
  path:
    description: "A directory or file to upload"
    required: true
  skip-if-does-not-exist:
    description: "Allow to skip if path doesn't exist, fail otherwise"
    default: false
    required: false
  prefix:
    description: "Unused: artifacts are stored as GitHub Actions artifacts of the current run, not under an S3 prefix"
    required: false
  aws-oidc-role-arn:
    description: "the OIDC role arn for aws auth (unused: this fork has no access to AWS/S3)"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Prepare artifact
      id: prepare-artifact
      shell: bash -euxo pipefail {0}
      env:
        SOURCE: ${{ inputs.path }}
        ARCHIVE: /tmp/uploads/${{ inputs.name }}.tar.zst
        SKIP_IF_DOES_NOT_EXIST: ${{ inputs.skip-if-does-not-exist }}
      run: |
        mkdir -p $(dirname $ARCHIVE)

        if [ -f ${ARCHIVE} ]; then
          echo >&2 "File ${ARCHIVE} already exist. Something went wrong before"
          exit 1
        fi

        ZSTD_NBTHREADS=0
        if [ -d  ${SOURCE} ]; then
          time tar -C ${SOURCE} -cf ${ARCHIVE} --zstd .
        elif [ -f ${SOURCE} ]; then
          time tar -cf ${ARCHIVE} --zstd ${SOURCE}
        elif ! ls ${SOURCE} > /dev/null 2>&1; then
          if [ "${SKIP_IF_DOES_NOT_EXIST}" = "true" ]; then
            echo 'SKIPPED=true' >> $GITHUB_OUTPUT
            exit 0
          else
            echo >&2 "${SOURCE} does not exist"
            exit 2
          fi
        else
          echo >&2 "${SOURCE} is neither a directory nor a file, do not know how to handle it"
          exit 3
        fi

        echo 'SKIPPED=false' >> $GITHUB_OUTPUT

    # This fork has no access to Neon's S3 bucket, so the archive is stored as a GitHub Actions
    # artifact of the current run instead. It stays a single .tar.zst (rather than uploading the
    # directory) because upload-artifact does not preserve file modes, and the binaries need +x.
    # `overwrite` mirrors the S3 behaviour of the latest upload winning (e.g. on a re-run).
    - name: Upload artifact
      if: ${{ steps.prepare-artifact.outputs.SKIPPED == 'false' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.name }}
        path: /tmp/uploads/${{ inputs.name }}.tar.zst
        # Already zstd-compressed
        compression-level: 0
        overwrite: true

    - name: Cleanup
      if: ${{ steps.prepare-artifact.outputs.SKIPPED == 'false' }}
      shell: bash -euxo pipefail {0}
      env:
        ARCHIVE: /tmp/uploads/${{ inputs.name }}.tar.zst
      run: |
        FILESIZE=$(du -sh ${ARCHIVE} | cut -f1)
        echo "$(basename ${ARCHIVE}) ${FILESIZE}" >> ${GITHUB_STEP_SUMMARY}
        rm -f ${ARCHIVE}
