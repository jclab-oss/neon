name: Create release PR

on:
  workflow_dispatch:
    inputs:
      component:
        description: "Component to release"
        required: true
        type: choice
        options:
          - compute
          - proxy
          - storage
      cherry-pick:
        description: "Commits to cherry-pick (space separated, makes this a hotfix based on previous release)"
        required: false
        type: string
        default: ''

  workflow_call:
    inputs:
      component:
        description: "Component to release"
        required: true
        type: string
      cherry-pick:
        description: "Commits to cherry-pick (space separated, makes this a hotfix based on previous release)"
        required: false
        type: string
        default: ''


# No permission for GITHUB_TOKEN by default; the **minimal required** set of permissions should be granted in each job.
permissions: {}

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  create-release-pr:
    runs-on: ubuntu-22.04

    permissions:
      contents: write

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@4d991eb9b905ef189e4c376166672c3f2f230481 # v2.11.0
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # A GitHub App's installation token when the NEON_BOT_CLIENT_ID and NEON_BOT_PRIVATE_KEY
      # secrets are set, upstream's CI_ACCESS_TOKEN otherwise (see the action)
      - name: Get CI access token
        id: ci-access-token
        uses: ./.github/actions/ci-access-token
        with:
          client-id: ${{ secrets.NEON_BOT_CLIENT_ID }}
          private-key: ${{ secrets.NEON_BOT_PRIVATE_KEY }}
          fallback-token: ${{ secrets.CI_ACCESS_TOKEN }}

      # Upstream's action opens the PR with `gh pr create`, which in a fork also queries the parent repository
      # (neondatabase/neon) and fails there on neondatabase's IP allow list. The step below does what the
      # action's `neon-release-pr new` does, but opens the PR with the REST API, which doesn't.
      # - name: Create release PR
      #   uses: neondatabase/dev-actions/release-pr@290dec821d86fa8a93f019e8c69720f5865b5677
      #   with:
      #     component: ${{ inputs.component }}
      #     cherry-pick: ${{ inputs.cherry-pick }}
      #   env:
      #     GH_TOKEN: ${{ secrets.CI_ACCESS_TOKEN }}
      - name: Create release PR
        env:
          GH_TOKEN: ${{ steps.ci-access-token.outputs.token }}
          COMPONENT: ${{ inputs.component }}
          CHERRY_PICK: ${{ inputs.cherry-pick }}
        run: |
          if [ "${COMPONENT}" = storage ]; then
            release_branch=release
          else
            release_branch="release-${COMPONENT}"
          fi
          now=$(date -u +%s)
          rc_branch="rc/release-${COMPONENT}/$(date -u -d "@${now}" +%Y-%m-%dT%H-%MZ)"
          title="${COMPONENT^} release $(date -u -d "@${now}" '+%Y-%m-%d %H:%M UTC')"
          read -ra commits <<< "${CHERRY_PICK}"
          # With cherry-picks, it is a hotfix on top of the previous release, otherwise a release of main
          if [ ${#commits[@]} -gt 0 ]; then
            base="${release_branch}"
          else
            base=main
          fi
          echo "RC branch ${rc_branch} from ${base}, for ${release_branch}"

          git fetch --all
          git switch -c "${rc_branch}" "origin/${base}"
          verified_commits=()
          for commit in "${commits[@]}"; do
            verified_commits+=("$(git rev-parse --verify "${commit}^{commit}")")
          done
          for commit in "${verified_commits[@]}"; do
            git cherry-pick "${commit}"
          done
          # A merge of the release branch that keeps this branch's tree, so that the PR fast-forwards it
          merge_commit=$(git commit-tree "HEAD^{tree}" -p HEAD -p "origin/${release_branch}" -m "${title}")
          git merge --ff-only "${merge_commit}"
          git push -u origin "${rc_branch}"

          pr=$(gh api "repos/${GITHUB_REPOSITORY}/pulls" \
            -f head="${rc_branch}" -f base="${release_branch}" -f title="${title}" -f body="" --jq .number)
          if [ ${#commits[@]} -gt 0 ]; then
            gh api "repos/${GITHUB_REPOSITORY}/issues/${pr}/labels" -f 'labels[]=release/hotfix' > /dev/null
          fi
          echo "Created ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/pull/${pr}" | tee -a "${GITHUB_STEP_SUMMARY}"
