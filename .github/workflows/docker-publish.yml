name: "New: Docker Image Publish"

# Minimal, self-contained replacement for the image-publishing parts of the upstream
# `build_and_test.yml` pipeline, which pushes to Docker Hub / ECR / ACR using Neon-internal
# accounts. This workflow only ever pushes to ghcr.io/${{ github.repository_owner }} using the
# built-in GITHUB_TOKEN, and only ever runs on GitHub-hosted runners. See `.fork/workflows.md`.

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      pg_versions:
        description: "JSON array of Postgres major versions to build compute images for"
        required: false
        default: '["v17"]'
        type: string

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_REPO: ghcr.io/${{ github.repository_owner }}

jobs:
  check-permissions:
    uses: ./.github/workflows/check-permissions.yml
    with:
      github-event-name: ${{ github.event_name }}

  build-build-tools-image:
    needs: [ check-permissions ]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-build-tools-image.yml
    with:
      archs: '["x64"]'
      debians: '["bookworm"]'
    secrets: inherit

  tag:
    needs: [ check-permissions ]
    runs-on: ${{ vars.RUNNER_DEFAULT || 'ubuntu-22.04' }}
    outputs:
      build-tag: ${{ steps.tag.outputs.build-tag }}
    steps:
      - name: Compute build tag
        id: tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "build-tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "build-tag=${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"
          fi

  build-and-push-storage-image:
    needs: [ build-build-tools-image, tag ]
    runs-on: ${{ vars.RUNNER_DOCKER_BUILD || 'ubuntu-24.04' }}
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@4d991eb9b905ef189e4c376166672c3f2f230481 # v2.11.0
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: true

      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
        with:
          cache-binary: false

      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the neon (storage) image
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          file: Dockerfile
          context: .
          push: true
          pull: true
          build-args: |
            REPOSITORY=${{ env.IMAGE_REPO }}
            IMAGE=build-tools
            TAG=${{ needs.build-build-tools-image.outputs.image-tag }}-bookworm-x64
            GIT_VERSION=${{ github.sha }}
            BUILD_TAG=${{ needs.tag.outputs.build-tag }}
          cache-from: type=gha,scope=neon-image
          cache-to: type=gha,mode=max,scope=neon-image
          tags: |
            ${{ env.IMAGE_REPO }}/neon:${{ needs.tag.outputs.build-tag }}
            ${{ github.ref == 'refs/heads/main' && format('{0}/neon:latest', env.IMAGE_REPO) || '' }}

  build-and-push-compute-image:
    needs: [ build-build-tools-image, tag ]
    runs-on: ${{ vars.RUNNER_DOCKER_BUILD || 'ubuntu-24.04' }}
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        pg-version: ${{ fromJSON(inputs.pg_versions || '["v17"]') }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@4d991eb9b905ef189e4c376166672c3f2f230481 # v2.11.0
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: true

      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
        with:
          cache-binary: false

      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Debian version for this Postgres version
        id: debian
        env:
          PG_VERSION: ${{ matrix.pg-version }}
        run: |
          # Mirrors the mapping used upstream: pg14/15 build on bullseye, pg16/17 on bookworm.
          if [[ "${PG_VERSION}" == "v14" || "${PG_VERSION}" == "v15" ]]; then
            echo "debian=bullseye" >> "$GITHUB_OUTPUT"
          else
            echo "debian=bookworm" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push the compute-node image
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          file: compute/compute-node.Dockerfile
          context: .
          push: true
          pull: true
          build-args: |
            REPOSITORY=${{ env.IMAGE_REPO }}
            IMAGE=build-tools
            TAG=${{ needs.build-build-tools-image.outputs.image-tag }}-${{ steps.debian.outputs.debian }}-x64
            PG_VERSION=${{ matrix.pg-version }}
            BUILD_TAG=${{ needs.tag.outputs.build-tag }}
            DEBIAN_VERSION=${{ steps.debian.outputs.debian }}
          cache-from: type=gha,scope=compute-${{ matrix.pg-version }}
          cache-to: type=gha,mode=max,scope=compute-${{ matrix.pg-version }}
          tags: |
            ${{ env.IMAGE_REPO }}/compute-node-${{ matrix.pg-version }}:${{ needs.tag.outputs.build-tag }}
            ${{ github.ref == 'refs/heads/main' && format('{0}/compute-node-{1}:latest', env.IMAGE_REPO, matrix.pg-version) || '' }}
