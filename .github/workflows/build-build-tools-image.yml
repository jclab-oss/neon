name: Build build-tools image

on:
  workflow_call:
    inputs:
      archs:
        description: "Json array of architectures to build"
        # Default values are set in `check-image` job, `set-variables` step
        type: string
        required: false
      debians:
        description: "Json array of Debian versions to build"
        # Default values are set in `check-image` job, `set-variables` step
        type: string
        required: false
    outputs:
      image-tag:
        description: "build-tools tag"
        value: ${{ jobs.check-image.outputs.tag }}
      image:
        description: "build-tools image"
        value: ghcr.io/${{ github.repository_owner }}/build-tools:${{ jobs.check-image.outputs.tag }}

defaults:
  run:
    shell: bash -euo pipefail {0}

# No permission for GITHUB_TOKEN by default; the **minimal required** set of permissions should be granted in each job.
permissions: {}

jobs:
  check-image:
    runs-on: ${{ vars.RUNNER_DEFAULT || 'ubuntu-22.04' }}
    outputs:
      archs: ${{ steps.set-variables.outputs.archs }}
      debians: ${{ steps.set-variables.outputs.debians }}
      tag: ${{ steps.set-variables.outputs.image-tag }}
      everything: ${{ steps.set-more-variables.outputs.everything }}
      found: ${{ steps.set-more-variables.outputs.found }}

    permissions:
      packages: read

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@4d991eb9b905ef189e4c376166672c3f2f230481 # v2.11.0
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set variables
        id: set-variables
        env:
          ARCHS: ${{ inputs.archs || '["x64","arm64"]' }}
          DEBIANS: ${{ inputs.debians || '["bullseye","bookworm"]' }}
          IMAGE_TAG: |
            ${{ hashFiles('build-tools/Dockerfile',
                          '.github/workflows/build-build-tools-image.yml') }}
        run: |
          echo "archs=${ARCHS}"           | tee -a ${GITHUB_OUTPUT}
          echo "debians=${DEBIANS}"       | tee -a ${GITHUB_OUTPUT}
          echo "image-tag=${IMAGE_TAG}"   | tee -a ${GITHUB_OUTPUT}

      - name: Set more variables
        id: set-more-variables
        env:
          IMAGE_TAG: ${{ steps.set-variables.outputs.image-tag }}
          IMAGE_REPO: ghcr.io/${{ github.repository_owner }}/build-tools
          EVERYTHING: |
            ${{ contains(fromJSON(steps.set-variables.outputs.archs), 'x64') &&
                contains(fromJSON(steps.set-variables.outputs.archs), 'arm64') &&
                contains(fromJSON(steps.set-variables.outputs.debians), 'bullseye') &&
                contains(fromJSON(steps.set-variables.outputs.debians), 'bookworm') }}
        run: |
          if docker manifest inspect "${IMAGE_REPO}:${IMAGE_TAG}"; then
            found=true
          else
            found=false
          fi

          echo "everything=${EVERYTHING}" | tee -a ${GITHUB_OUTPUT}
          echo "found=${found}"           | tee -a ${GITHUB_OUTPUT}

  build-image:
    needs: [ check-image ]
    if: needs.check-image.outputs.found == 'false'

    # build-and-test.yml and docker-publish.yml both call this workflow on the same
    # push, so two identical build-image jobs started seconds apart and raced to
    # reserve the same type=gha cache keys, both dying with
    #   ERROR: failed to solve: error writing layer blob: failed to reserve cache
    # That is a key-conflict from the cache API, not a capacity problem - raising the
    # cache size does not help. It only became frequent once the cache was emptied,
    # because then both jobs upload every layer instead of mostly hitting cache.
    #
    # Serialise per image tag (and per matrix cell, so architectures still build in
    # parallel). The second caller waits, then builds almost entirely from the cache
    # the first one just wrote, which also removes the duplicate ~40 min build.
    # cancel-in-progress must stay false, or the two callers would cancel each other.
    concurrency:
      group: build-tools-image-${{ needs.check-image.outputs.tag }}-${{ matrix.debian }}-${{ matrix.arch }}
      cancel-in-progress: false

    strategy:
      matrix:
        arch: ${{ fromJSON(needs.check-image.outputs.archs) }}
        debian: ${{ fromJSON(needs.check-image.outputs.debians) }}

    permissions:
      packages: write

    # Default to GitHub-hosted runners. Purpose-specific runner labels can be overridden via
    # repository/organization variables if a self-hosted or larger runner is desired.
    runs-on: >-
      ${{
        matrix.arch == 'arm64'
          && (vars.RUNNER_BUILD_TOOLS_ARM64 || 'ubuntu-24.04-arm')
          || (vars.RUNNER_BUILD_TOOLS || 'ubuntu-24.04')
      }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@4d991eb9b905ef189e4c376166672c3f2f230481 # v2.11.0
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
        with:
          cache-binary: false

      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          file: build-tools/Dockerfile
          context: .
          attests: |
            type=provenance,mode=max
            type=sbom,generator=docker.io/docker/buildkit-syft-scanner:1
          push: true
          pull: true
          build-args: |
            DEBIAN_VERSION=${{ matrix.debian }}
          cache-from: type=gha,scope=build-tools-${{ matrix.debian }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=build-tools-${{ matrix.debian }}-${{ matrix.arch }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/build-tools:${{ needs.check-image.outputs.tag }}-${{ matrix.debian }}-${{ matrix.arch }}

  merge-images:
    needs: [ check-image, build-image ]
    runs-on: ${{ vars.RUNNER_DEFAULT || 'ubuntu-22.04' }}

    permissions:
      packages: write

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@4d991eb9b905ef189e4c376166672c3f2f230481 # v2.11.0
        with:
          egress-policy: audit

      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch image
        env:
          DEFAULT_DEBIAN_VERSION: bookworm
          ARCHS: ${{ join(fromJSON(needs.check-image.outputs.archs), ' ') }}
          DEBIANS: ${{ join(fromJSON(needs.check-image.outputs.debians), ' ') }}
          EVERYTHING: ${{ needs.check-image.outputs.everything }}
          IMAGE_TAG: ${{ needs.check-image.outputs.tag }}
          IMAGE_REPO: ghcr.io/${{ github.repository_owner }}/build-tools
        run: |
          for debian in ${DEBIANS}; do
            tags=("-t" "${IMAGE_REPO}:${IMAGE_TAG}-${debian}")

            if [ "${EVERYTHING}" == "true" ] && [ "${debian}" == "${DEFAULT_DEBIAN_VERSION}" ]; then
              tags+=("-t" "${IMAGE_REPO}:${IMAGE_TAG}")
            fi

            for arch in ${ARCHS}; do
              tags+=("${IMAGE_REPO}:${IMAGE_TAG}-${debian}-${arch}")
            done

            docker buildx imagetools create "${tags[@]}"
          done
