name: Build and Test

on:
  push:
    branches:
      - main
      - release
      - release-proxy
      - release-compute
  pull_request:
  # Manual runs, handled like a PR run (run-kind `workflow-dispatch`).
  workflow_dispatch:
    inputs:
      pg-versions:
        description: 'Postgres versions to build and test, e.g. "v16,v17" (empty: the PG_VERSIONS repository variable, or else all of them)'
        type: string
        required: false
        default: ''

defaults:
  run:
    shell: bash -euxo pipefail {0}

concurrency:
  # Allow only one workflow per any non-`main` branch.
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.ref_name == 'main' && github.sha || 'anysha' }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: 1
  COPT: '-Werror'

jobs:
  check-permissions:
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'run-no-ci') }}
    uses: ./.github/workflows/check-permissions.yml
    with:
      github-event-name: ${{ github.event_name }}

  files-changed:
    needs: [ check-permissions ]
    runs-on: ${{ startsWith(vars.RUNNER_SMALL, '[') && fromJSON(vars.RUNNER_SMALL) || vars.RUNNER_SMALL || 'ubuntu-22.04' }}
    timeout-minutes: 3
    outputs:
      check-rust-dependencies: ${{ steps.files-changed.outputs.rust_dependencies }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@4d991eb9b905ef189e4c376166672c3f2f230481 # v2.11.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: true

      - name: Check for file changes
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36  # v3.0.2
        id: files-changed
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filters: .github/file-filters.yaml

  meta:
    needs: [ check-permissions ]
    uses: ./.github/workflows/_meta.yml
    with:
      github-event-name: ${{ github.event_name }}
      github-event-json: ${{ toJSON(github.event) }}

  # The Postgres versions to build compute images for and to run the per-version tests on: the `pg-versions`
  # input of a manual run, else the PG_VERSIONS repository variable, else all of them. Either is a
  # comma-separated list like `v16,v17` (or `16,17`). `build-neon` still builds every version: the Rust
  # code (libs/postgres_ffi) needs all of them.
  pg-versions:
    needs: [ meta ]
    runs-on: ${{ startsWith(vars.RUNNER_SMALL, '[') && fromJSON(vars.RUNNER_SMALL) || vars.RUNNER_SMALL || 'ubuntu-22.04' }}
    outputs:
      versions: ${{ steps.select.outputs.versions }}
      compute: ${{ steps.select.outputs.compute }}
      test-extensions: ${{ steps.select.outputs.test-extensions }}
      release-test-cfg: ${{ steps.select.outputs.release-test-cfg }}
      debug-test-cfg: ${{ steps.select.outputs.debug-test-cfg }}
      test-extensions-latest-map: ${{ steps.select.outputs.test-extensions-latest-map }}
      test-extensions-release-map: ${{ steps.select.outputs.test-extensions-release-map }}
    steps:
      - name: Select Postgres versions
        id: select
        env:
          PG_VERSIONS: ${{ inputs.pg-versions || vars.PG_VERSIONS }}
          REGISTRY: ghcr.io/${{ github.repository_owner }}
          BUILD_TAG: ${{ needs.meta.outputs.build-tag }}
          RELEASE_PR_RUN_ID: ${{ needs.meta.outputs.release-pr-run-id }}
        shell: python3 {0}
        run: |
          import json, os, sys

          # Much data was already generated on old PG versions with bullseye's
          # libraries, the locales of which can cause data incompatibilities.
          # However, new PG versions should be build on newer images,
          # as that reduces the support burden of old and ancient distros.
          debian = {"v14": "bullseye", "v15": "bullseye", "v16": "bullseye", "v17": "bookworm"}

          requested = os.environ["PG_VERSIONS"].strip()
          if requested:
              versions = []
              for item in requested.split(","):
                  item = item.strip()
                  if not item:
                      continue
                  version = item if item.startswith("v") else f"v{item}"
                  if version not in debian:
                      sys.exit(f"Unknown Postgres version {item!r} in {requested!r}, expected some of {', '.join(debian)}")
                  if version not in versions:
                      versions.append(version)
              if not versions:
                  sys.exit(f"No Postgres versions in {requested!r}")
          else:
              versions = list(debian)
          versions.sort(key=lambda v: int(v[1:]))
          # neon-test-extensions images (and test-images) only exist for these versions
          test_extensions = [v for v in versions if v in ("v16", "v17")]

          registry, build_tag = os.environ["REGISTRY"], os.environ["BUILD_TAG"]
          release_pr_run_id = os.environ["RELEASE_PR_RUN_ID"]
          outputs = {
              "versions": versions,
              "compute": [{"pg": v, "debian": debian[v]} for v in versions],
              "test-extensions": test_extensions,
              # Release builds run the tests on every version with LFC, and on v17 without it as well;
              # debug builds only on the latest version, without LFC.
              "release-test-cfg": [{"pg_version": v, "lfc_state": "with-lfc"} for v in versions]
              + [{"pg_version": "v17", "lfc_state": "without-lfc"} for v in versions if v == "v17"],
              "debug-test-cfg": [{"pg_version": versions[-1], "lfc_state": "without-lfc"}],
              "test-extensions-latest-map": {
                  f"{registry}/neon-test-extensions-{v}:{build_tag}": [f"{registry}/neon-test-extensions-{v}:latest"]
                  for v in test_extensions
              },
              "test-extensions-release-map": {
                  f"{registry}/neon-test-extensions-{v}:{release_pr_run_id}": [f"{registry}/neon-test-extensions-{v}:{build_tag}"]
                  for v in test_extensions
              },
          }
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              for key, value in outputs.items():
                  f.write(f"{key}={json.dumps(value)}\n")
                  print(f"{key}: {json.dumps(value)}")

  build-build-tools-image:
    needs: [ check-permissions ]
    # Reusable workflows can't get more permissions than their caller grants, and this repo's default
    # GITHUB_TOKEN is read-only (upstream's is read-write), so grant what the called jobs request.
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-build-tools-image.yml
    secrets: inherit

  lint-yamls:
    needs: [ meta, check-permissions, build-build-tools-image ]
    # We do need to run this in `.*-rc-pr` because of hotfixes.
    if: ${{ contains(fromJSON('["pr", "workflow-dispatch", "push-main", "storage-rc-pr", "proxy-rc-pr", "compute-rc-pr"]'), needs.meta.outputs.run-kind) }}
    runs-on: ${{ startsWith(vars.RUNNER_SMALL, '[') && fromJSON(vars.RUNNER_SMALL) || vars.RUNNER_SMALL || 'ubuntu-22.04' }}
    container:
      image: ${{ needs.build-build-tools-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # GitHub-hosted runners own the workspace, /__w/_temp and /github/home as uid 1001, while the
      # build-tools image runs as `nonroot` (uid 1000), so run as 1001 (non-root, as initdb requires)
      # and borrow the host's passwd entry for it.
      options: --init --user 1001:1001
      volumes:
        - /etc/passwd:/etc/passwd:ro

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@4d991eb9b905ef189e4c376166672c3f2f230481 # v2.11.0
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - run: make -C compute manifest-schema-validation
      - run: make lint-openapi-spec

  check-codestyle-python:
    needs: [ meta, check-permissions, build-build-tools-image ]
    # No need to run on `main` because we this in the merge queue. We do need to run this in `.*-rc-pr` because of hotfixes.
    if: ${{ contains(fromJSON('["pr", "workflow-dispatch", "storage-rc-pr", "proxy-rc-pr", "compute-rc-pr"]'), needs.meta.outputs.run-kind) }}
    uses: ./.github/workflows/_check-codestyle-python.yml
    with:
      build-tools-image: ${{ needs.build-build-tools-image.outputs.image }}-bookworm
    secrets: inherit

  check-codestyle-jsonnet:
    needs: [ meta, check-permissions, build-build-tools-image ]
    # We do need to run this in `.*-rc-pr` because of hotfixes.
    if: ${{ contains(fromJSON('["pr", "workflow-dispatch", "push-main", "storage-rc-pr", "proxy-rc-pr", "compute-rc-pr"]'), needs.meta.outputs.run-kind) }}
    runs-on: ${{ startsWith(vars.RUNNER_SMALL, '[') && fromJSON(vars.RUNNER_SMALL) || vars.RUNNER_SMALL || 'ubuntu-22.04' }}
    container:
      image: ${{ needs.build-build-tools-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # GitHub-hosted runners own the workspace, /__w/_temp and /github/home as uid 1001, while the
      # build-tools image runs as `nonroot` (uid 1000), so run as 1001 (non-root, as initdb requires)
      # and borrow the host's passwd entry for it.
      options: --init --user 1001:1001
      volumes:
        - /etc/passwd:/etc/passwd:ro

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@4d991eb9b905ef189e4c376166672c3f2f230481 # v2.11.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check Jsonnet code formatting
        run: |
          make -C compute jsonnetfmt-test

  # Check that the vendor/postgres-* submodules point to the
  # corresponding REL_*_STABLE_neon branches.
  check-submodules:
    needs: [ check-permissions ]
    runs-on: ubuntu-22.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@4d991eb9b905ef189e4c376166672c3f2f230481 # v2.11.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: true

      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: check-if-submodules-changed
        with:
          filters: |
            vendor:
              - 'vendor/**'

      - name: Check vendor/postgres-v14 submodule reference
        if: steps.check-if-submodules-changed.outputs.vendor == 'true'
        uses: jtmullen/submodule-branch-check-action@ab0d3a69278e3fa0a2d4f3be3199d2514b676e13 # v1.3.0
        with:
          path: "vendor/postgres-v14"
          fetch_depth: "50"
          sub_fetch_depth: "50"
          pass_if_unchanged: true

      - name: Check vendor/postgres-v15 submodule reference
        if: steps.check-if-submodules-changed.outputs.vendor == 'true'
        uses: jtmullen/submodule-branch-check-action@ab0d3a69278e3fa0a2d4f3be3199d2514b676e13 # v1.3.0
        with:
          path: "vendor/postgres-v15"
          fetch_depth: "50"
          sub_fetch_depth: "50"
          pass_if_unchanged: true

      - name: Check vendor/postgres-v16 submodule reference
        if: steps.check-if-submodules-changed.outputs.vendor == 'true'
        uses: jtmullen/submodule-branch-check-action@ab0d3a69278e3fa0a2d4f3be3199d2514b676e13 # v1.3.0
        with:
          path: "vendor/postgres-v16"
          fetch_depth: "50"
          sub_fetch_depth: "50"
          pass_if_unchanged: true

      - name: Check vendor/postgres-v17 submodule reference
        if: steps.check-if-submodules-changed.outputs.vendor == 'true'
        uses: jtmullen/submodule-branch-check-action@ab0d3a69278e3fa0a2d4f3be3199d2514b676e13 # v1.3.0
        with:
          path: "vendor/postgres-v17"
          fetch_depth: "50"
          sub_fetch_depth: "50"
          pass_if_unchanged: true

  check-codestyle-rust:
    needs: [ meta, check-permissions, build-build-tools-image ]
    # No need to run on `main` because we this in the merge queue. We do need to run this in `.*-rc-pr` because of hotfixes.
    if: ${{ contains(fromJSON('["pr", "workflow-dispatch", "storage-rc-pr", "proxy-rc-pr", "compute-rc-pr"]'), needs.meta.outputs.run-kind) }}
    uses: ./.github/workflows/_check-codestyle-rust.yml
    with:
      build-tools-image: ${{ needs.build-build-tools-image.outputs.image }}-bookworm
      archs: '["x64", "arm64"]'
    secrets: inherit

  check-dependencies-rust:
    needs: [ meta, files-changed, build-build-tools-image ]
    # No need to run on `main` because we this in the merge queue. We do need to run this in `.*-rc-pr` because of hotfixes.
    if: ${{ needs.files-changed.outputs.check-rust-dependencies == 'true' && contains(fromJSON('["pr", "workflow-dispatch", "storage-rc-pr", "proxy-rc-pr", "compute-rc-pr"]'), needs.meta.outputs.run-kind) }}
    uses: ./.github/workflows/cargo-deny.yml
    with:
      build-tools-image: ${{ needs.build-build-tools-image.outputs.image }}-bookworm
    secrets: inherit

  build-and-test-locally:
    needs: [ meta, pg-versions, build-build-tools-image ]
    # We do need to run this in `.*-rc-pr` because of hotfixes.
    if: ${{ contains(fromJSON('["pr", "workflow-dispatch", "push-main", "storage-rc-pr", "proxy-rc-pr", "compute-rc-pr"]'), needs.meta.outputs.run-kind) }}
    # Reusable workflows can't get more permissions than their caller grants, and this repo's default
    # GITHUB_TOKEN is read-only (upstream's is read-write), so grant what the called jobs request.
    permissions:
      contents: read
      statuses: write
    strategy:
      fail-fast: false
      matrix:
        arch: [ x64, arm64 ]
        # Do not build or run tests in debug for release branches
        build-type: ${{ fromJSON((startsWith(github.ref_name, 'release') && github.event_name == 'push') && '["release"]' || '["debug", "release"]') }}
        include:
          - build-type: release
            arch: arm64
    uses: ./.github/workflows/_build-and-test-locally.yml
    with:
      arch: ${{ matrix.arch }}
      build-tools-image: ${{ needs.build-build-tools-image.outputs.image }}-bookworm
      build-tag: ${{ needs.meta.outputs.build-tag }}
      build-type: ${{ matrix.build-type }}
      # Run tests on all (selected) Postgres versions in release builds and only on the latest version in debug builds.
      # Run without LFC on v17 release and debug builds only. For all the other cases LFC is enabled.
      # See the `pg-versions` job.
      test-cfg: ${{ matrix.build-type == 'release' && needs.pg-versions.outputs.release-test-cfg || needs.pg-versions.outputs.debug-test-cfg }}
    secrets: inherit

  # Upstream's `get-benchmarks-durations`, `benchmarks` and `report-benchmarks-results-to-slack` jobs are
  # dropped: they need dedicated benchmark hardware (`unit-perf-aws-arm`), Neon's AWS role and internal
  # results database, and its Slack workspace.

  create-test-report:
    needs: [ check-permissions, build-and-test-locally, coverage-report, build-build-tools-image ]
    if: ${{ !cancelled() && contains(fromJSON('["skipped", "success"]'), needs.check-permissions.result) }}
    permissions:
      statuses: write
      contents: write
      pull-requests: write
    outputs:
      report-url: ${{ steps.create-allure-report.outputs.report-url }}

    runs-on: ${{ startsWith(vars.RUNNER_SMALL, '[') && fromJSON(vars.RUNNER_SMALL) || vars.RUNNER_SMALL || 'ubuntu-22.04' }}
    container:
      image: ${{ needs.build-build-tools-image.outputs.image }}-bookworm
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # GitHub-hosted runners own the workspace, /__w/_temp and /github/home as uid 1001, while the
      # build-tools image runs as `nonroot` (uid 1000), so run as 1001 (non-root, as initdb requires)
      # and borrow the host's passwd entry for it.
      options: --init --user 1001:1001
      volumes:
        - /etc/passwd:/etc/passwd:ro

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@4d991eb9b905ef189e4c376166672c3f2f230481 # v2.11.0
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Create Allure report
        if: ${{ !cancelled() }}
        id: create-allure-report
        uses: ./.github/actions/allure-report-generate
        # Upstream also stores the results into its internal test-results database (`store-test-results-into-db`)

      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        if: ${{ !cancelled() }}
        with:
          # Retry script for 5XX server errors: https://github.com/actions/github-script#retries
          retries: 5
          script: |
            const report = {
              reportUrl:     "${{ steps.create-allure-report.outputs.report-url }}",
              reportJsonUrl: "${{ steps.create-allure-report.outputs.report-json-url }}",
            }

            const coverage = {
              coverageUrl: "${{ needs.coverage-report.outputs.coverage-html }}",
              summaryJsonUrl: "${{ needs.coverage-report.outputs.coverage-json }}",
            }

            // The Allure report JSON is a local file here (upstream serves it from S3), which `fetch` can't read
            const fs = require("fs")
            const fetchOrReadFile = async (url) => url.startsWith("/")
              ? { json: async () => JSON.parse(fs.readFileSync(url, "utf8")) }
              : fetch(url)

            const script = require("./scripts/comment-test-report.js")
            await script({
              github,
              context,
              fetch: fetchOrReadFile,
              report,
              coverage,
            })

  coverage-report:
    if: ${{ !startsWith(github.ref_name, 'release') }}
    needs: [ check-permissions, build-build-tools-image, build-and-test-locally ]
    permissions:
      statuses: write
      contents: write
    runs-on: ${{ startsWith(vars.RUNNER_SMALL, '[') && fromJSON(vars.RUNNER_SMALL) || vars.RUNNER_SMALL || 'ubuntu-22.04' }}
    container:
      image: ${{ needs.build-build-tools-image.outputs.image }}-bookworm
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # GitHub-hosted runners own the workspace, /__w/_temp and /github/home as uid 1001, while the
      # build-tools image runs as `nonroot` (uid 1000), so run as 1001 (non-root, as initdb requires)
      # and borrow the host's passwd entry for it.
      options: --init --user 1001:1001
      volumes:
        - /etc/passwd:/etc/passwd:ro
    strategy:
      fail-fast: false
      matrix:
        build_type: [ debug ]
    outputs:
        coverage-html: ${{ steps.upload-coverage-report-new.outputs.artifact-url }}
        coverage-json: ${{ steps.build-coverage-report-new.outputs.summary-json }}
    steps:
      # Need `fetch-depth: 0` for differential coverage (to get diff between two commits)
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@4d991eb9b905ef189e4c376166672c3f2f230481 # v2.11.0
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: true
          fetch-depth: 0

      - name: Get Neon artifact
        uses: ./.github/actions/download
        with:
          name: neon-${{ runner.os }}-${{ runner.arch }}-${{ matrix.build_type }}-artifact
          path: /tmp/neon

      - name: Get coverage artifact
        uses: ./.github/actions/download
        with:
          name: coverage-data-artifact
          path: /tmp/coverage

      - name: Merge coverage data
        run: scripts/coverage "--profraw-prefix=$GITHUB_JOB" --dir=/tmp/coverage merge

      - name: Build coverage report
        env:
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          scripts/coverage --dir=/tmp/coverage \
            report \
            --input-objects=/tmp/coverage/binaries.list \
            --commit-url=${COMMIT_URL} \
            --format=github

          scripts/coverage --dir=/tmp/coverage \
            report \
            --input-objects=/tmp/coverage/binaries.list \
            --format=lcov

      # Upstream publishes the HTML report to (and takes the baseline for a differential report from)
      # Neon's S3 bucket. Here the report is a GitHub Actions artifact of the run, without a baseline.
      - name: Build coverage report NEW
        id: build-coverage-report-new
        env:
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          CURRENT="${COMMIT_SHA}"

          cp /tmp/coverage/report/lcov.info ./${CURRENT}.info

          GENHTML_ARGS="--ignore-errors path,unmapped,empty --synthesize-missing --demangle-cpp rustfilt --output-directory lcov-html ${CURRENT}.info"

          genhtml ${GENHTML_ARGS}

          # The summary is small, so hand it over inline (as a data: URL) for scripts/comment-test-report.js to `fetch`
          if [ -f lcov-html/summary.json ] && [ "$(stat -c %s lcov-html/summary.json)" -lt 262144 ]; then
            echo "summary-json=data:application/json;base64,$(base64 -w0 lcov-html/summary.json)" >> $GITHUB_OUTPUT
          fi

      - name: Upload coverage report NEW
        id: upload-coverage-report-new
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: lcov-html/
          overwrite: true

      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          REPORT_URL_NEW: ${{ steps.upload-coverage-report-new.outputs.artifact-url }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        with:
          # Retry script for 5XX server errors: https://github.com/actions/github-script#retries
          retries: 5
          script: |
            const { REPORT_URL_NEW, COMMIT_SHA } = process.env

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: `${COMMIT_SHA}`,
              state: 'success',
              target_url: `${REPORT_URL_NEW}`,
              context: 'Code coverage report NEW',
            })

  # Upstream's `trigger-e2e-tests` job is dropped: it runs e2e tests in the private neondatabase/cloud repo.

  neon-image-arch:
    needs: [ check-permissions, build-build-tools-image, meta ]
    if: ${{ contains(fromJSON('["push-main", "pr", "workflow-dispatch", "storage-rc-pr", "proxy-rc-pr"]'), needs.meta.outputs.run-kind) }}
    strategy:
      matrix:
        arch: [ x64, arm64 ]

    runs-on: ${{ matrix.arch == 'arm64' && (startsWith(vars.RUNNER_LARGE_ARM64, '[') && fromJSON(vars.RUNNER_LARGE_ARM64) || vars.RUNNER_LARGE_ARM64 || 'ubuntu-22.04-arm') || (startsWith(vars.RUNNER_LARGE, '[') && fromJSON(vars.RUNNER_LARGE) || vars.RUNNER_LARGE || 'ubuntu-22.04') }}

    permissions:
      packages: write

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@4d991eb9b905ef189e4c376166672c3f2f230481 # v2.11.0
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: true
          ref: ${{ needs.meta.outputs.sha }}

      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
        with:
          cache-binary: false

      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          # ARM-specific flags are recommended for Graviton ≥ 2, these flags are also supported by Ampere Altra (Azure)
          # https://github.com/aws/aws-graviton-getting-started/blob/57dc813626d0266f1cc12ef83474745bb1f31fb4/rust.md
          build-args: |
            ADDITIONAL_RUSTFLAGS=${{ matrix.arch == 'arm64' && '-Ctarget-feature=+lse -Ctarget-cpu=neoverse-n1' || '' }}
            GIT_VERSION=${{ github.event.pull_request.head.sha || github.sha }}
            BUILD_TAG=${{ needs.meta.outputs.release-tag || needs.meta.outputs.build-tag }}
            REPOSITORY=ghcr.io/${{ github.repository_owner }}
            TAG=${{ needs.build-build-tools-image.outputs.image-tag }}-bookworm
            DEBIAN_VERSION=bookworm
          # No SUBZERO_ACCESS_TOKEN secret: the Dockerfile then builds against the in-tree subzero-core stub
          attests: |
            type=provenance,mode=max
            type=sbom,generator=docker.io/docker/buildkit-syft-scanner:1
          push: true
          pull: true
          file: Dockerfile
          # Upstream keeps its layer cache in the private cache.neon.build registry; keep it next to the image in GHCR instead.
          # PRs also keep a cache of their own (cache-pr<N>-*), read on top of main's and never written to main's.
          cache-from: |
            type=registry,ref=ghcr.io/${{ github.repository_owner }}/neon:cache-bookworm-${{ matrix.arch }}
            ${{ github.event.pull_request.number && format('type=registry,ref=ghcr.io/{0}/neon:cache-pr{1}-{2}-{3}', github.repository_owner, github.event.pull_request.number, 'bookworm', matrix.arch) || '' }}
          cache-to: ${{ github.ref_name == 'main' && format('type=registry,ref=ghcr.io/{0}/neon:cache-{1}-{2},mode=max', github.repository_owner, 'bookworm', matrix.arch) || github.event.pull_request.number && format('type=registry,ref=ghcr.io/{0}/neon:cache-pr{1}-{2}-{3},mode=max', github.repository_owner, github.event.pull_request.number, 'bookworm', matrix.arch) || '' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/neon:${{ needs.meta.outputs.build-tag }}-bookworm-${{ matrix.arch }}

  neon-image:
    needs: [ neon-image-arch, meta ]
    if: ${{ contains(fromJSON('["push-main", "pr", "workflow-dispatch", "storage-rc-pr", "proxy-rc-pr"]'), needs.meta.outputs.run-kind) }}
    runs-on: ubuntu-22.04
    permissions:
      statuses: write
      contents: read
      packages: write

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@4d991eb9b905ef189e4c376166672c3f2f230481 # v2.11.0
        with:
          egress-policy: audit

      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch image
        run: |
          docker buildx imagetools create -t ghcr.io/${{ github.repository_owner }}/neon:${{ needs.meta.outputs.build-tag }} \
                                          -t ghcr.io/${{ github.repository_owner }}/neon:${{ needs.meta.outputs.build-tag }}-bookworm \
                                             ghcr.io/${{ github.repository_owner }}/neon:${{ needs.meta.outputs.build-tag }}-bookworm-x64 \
                                             ghcr.io/${{ github.repository_owner }}/neon:${{ needs.meta.outputs.build-tag }}-bookworm-arm64

  compute-node-image-arch:
    needs: [ check-permissions, meta, pg-versions ]
    if: ${{ contains(fromJSON('["push-main", "pr", "workflow-dispatch", "compute-rc-pr"]'), needs.meta.outputs.run-kind) }}
    permissions:
      statuses: write
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        # The selected Postgres versions, each with its Debian version: see the `pg-versions` job.
        version: ${{ fromJSON(needs.pg-versions.outputs.compute) }}
        arch: [ x64, arm64 ]

    runs-on: ${{ matrix.arch == 'arm64' && (startsWith(vars.RUNNER_LARGE_ARM64, '[') && fromJSON(vars.RUNNER_LARGE_ARM64) || vars.RUNNER_LARGE_ARM64 || 'ubuntu-22.04-arm') || (startsWith(vars.RUNNER_LARGE, '[') && fromJSON(vars.RUNNER_LARGE) || vars.RUNNER_LARGE || 'ubuntu-22.04') }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@4d991eb9b905ef189e4c376166672c3f2f230481 # v2.11.0
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: true
          ref: ${{ needs.meta.outputs.sha }}

      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
        with:
          cache-binary: false
          # Disable parallelism for docker buildkit.
          # As we already build everything with `make -j$(nproc)`, running it in additional level of parallelisam blows up the Runner.
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 1

      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build compute-node image
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          build-args: |
            GIT_VERSION=${{ github.event.pull_request.head.sha || github.sha }}
            PG_VERSION=${{ matrix.version.pg }}
            BUILD_TAG=${{ needs.meta.outputs.release-tag || needs.meta.outputs.build-tag }}
            DEBIAN_VERSION=${{ matrix.version.debian }}
          attests: |
            type=provenance,mode=max
            type=sbom,generator=docker.io/docker/buildkit-syft-scanner:1
          push: true
          pull: true
          file: compute/compute-node.Dockerfile
          # Upstream keeps its layer cache in the private cache.neon.build registry; keep it next to the image in GHCR instead.
          # PRs also keep a cache of their own (cache-pr<N>-*), read on top of main's and never written to main's.
          cache-from: |
            type=registry,ref=ghcr.io/${{ github.repository_owner }}/compute-node-${{ matrix.version.pg }}:cache-${{ matrix.version.debian }}-${{ matrix.arch }}
            ${{ github.event.pull_request.number && format('type=registry,ref=ghcr.io/{0}/compute-node-{1}:cache-pr{2}-{3}-{4}', github.repository_owner, matrix.version.pg, github.event.pull_request.number, matrix.version.debian, matrix.arch) || '' }}
          cache-to: ${{ github.ref_name == 'main' && format('type=registry,ref=ghcr.io/{0}/compute-node-{1}:cache-{2}-{3},mode=max', github.repository_owner, matrix.version.pg, matrix.version.debian, matrix.arch) || github.event.pull_request.number && format('type=registry,ref=ghcr.io/{0}/compute-node-{1}:cache-pr{2}-{3}-{4},mode=max', github.repository_owner, matrix.version.pg, github.event.pull_request.number, matrix.version.debian, matrix.arch) || '' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/compute-node-${{ matrix.version.pg }}:${{ needs.meta.outputs.build-tag }}-${{ matrix.version.debian }}-${{ matrix.arch }}

      - name: Build neon extensions test image
        if: matrix.version.pg >= 'v16'
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          build-args: |
            GIT_VERSION=${{ github.event.pull_request.head.sha || github.sha }}
            PG_VERSION=${{ matrix.version.pg }}
            BUILD_TAG=${{ needs.meta.outputs.release-tag || needs.meta.outputs.build-tag }}
            DEBIAN_VERSION=${{ matrix.version.debian }}
          attests: |
            type=provenance,mode=max
            type=sbom,generator=docker.io/docker/buildkit-syft-scanner:1
          push: true
          pull: true
          file: compute/compute-node.Dockerfile
          target: extension-tests
          cache-from: |
            type=registry,ref=ghcr.io/${{ github.repository_owner }}/compute-node-${{ matrix.version.pg }}:cache-${{ matrix.version.debian }}-${{ matrix.arch }}
            ${{ github.event.pull_request.number && format('type=registry,ref=ghcr.io/{0}/compute-node-{1}:cache-pr{2}-{3}-{4}', github.repository_owner, matrix.version.pg, github.event.pull_request.number, matrix.version.debian, matrix.arch) || '' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/neon-test-extensions-${{ matrix.version.pg }}:${{needs.meta.outputs.build-tag}}-${{ matrix.version.debian }}-${{ matrix.arch }}

  compute-node-image:
    needs: [ compute-node-image-arch, meta, pg-versions ]
    if: ${{ contains(fromJSON('["push-main", "pr", "workflow-dispatch", "compute-rc-pr"]'), needs.meta.outputs.run-kind) }}
    permissions:
      statuses: write
      contents: read
      packages: write
    runs-on: ubuntu-22.04

    strategy:
      matrix:
        # see the comment for `compute-node-image-arch` job
        version: ${{ fromJSON(needs.pg-versions.outputs.compute) }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@4d991eb9b905ef189e4c376166672c3f2f230481 # v2.11.0
        with:
          egress-policy: audit

      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch compute-node image
        run: |
          docker buildx imagetools create -t ghcr.io/${{ github.repository_owner }}/compute-node-${{ matrix.version.pg }}:${{ needs.meta.outputs.build-tag }} \
                                          -t ghcr.io/${{ github.repository_owner }}/compute-node-${{ matrix.version.pg }}:${{ needs.meta.outputs.build-tag }}-${{ matrix.version.debian }} \
                                             ghcr.io/${{ github.repository_owner }}/compute-node-${{ matrix.version.pg }}:${{ needs.meta.outputs.build-tag }}-${{ matrix.version.debian }}-x64 \
                                             ghcr.io/${{ github.repository_owner }}/compute-node-${{ matrix.version.pg }}:${{ needs.meta.outputs.build-tag }}-${{ matrix.version.debian }}-arm64

      - name: Create multi-arch neon-test-extensions image
        if: matrix.version.pg >= 'v16'
        run: |
          docker buildx imagetools create -t ghcr.io/${{ github.repository_owner }}/neon-test-extensions-${{ matrix.version.pg }}:${{ needs.meta.outputs.build-tag }} \
                                          -t ghcr.io/${{ github.repository_owner }}/neon-test-extensions-${{ matrix.version.pg }}:${{ needs.meta.outputs.build-tag }}-${{ matrix.version.debian }} \
                                             ghcr.io/${{ github.repository_owner }}/neon-test-extensions-${{ matrix.version.pg }}:${{ needs.meta.outputs.build-tag }}-${{ matrix.version.debian }}-x64 \
                                             ghcr.io/${{ github.repository_owner }}/neon-test-extensions-${{ matrix.version.pg }}:${{ needs.meta.outputs.build-tag }}-${{ matrix.version.debian }}-arm64

  vm-compute-node-image-arch:
    needs: [ check-permissions, meta, pg-versions, compute-node-image ]
    if: ${{ contains(fromJSON('["push-main", "pr", "workflow-dispatch", "compute-rc-pr"]'), needs.meta.outputs.run-kind) }}
    runs-on: ${{ matrix.arch == 'arm64' && (startsWith(vars.RUNNER_LARGE_ARM64, '[') && fromJSON(vars.RUNNER_LARGE_ARM64) || vars.RUNNER_LARGE_ARM64 || 'ubuntu-22.04-arm') || (startsWith(vars.RUNNER_LARGE, '[') && fromJSON(vars.RUNNER_LARGE) || vars.RUNNER_LARGE || 'ubuntu-22.04') }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        arch: [ amd64, arm64 ]
        # see the comment for `compute-node-image-arch` job
        version: ${{ fromJSON(needs.pg-versions.outputs.compute) }}
    env:
      VM_BUILDER_VERSION: v0.46.0

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@4d991eb9b905ef189e4c376166672c3f2f230481 # v2.11.0
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Downloading vm-builder
        run: |
          curl -fL https://github.com/neondatabase/autoscaling/releases/download/$VM_BUILDER_VERSION/vm-builder-${{ matrix.arch }} -o vm-builder
          chmod +x vm-builder

      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Note: we need a separate pull step here because otherwise vm-builder will try to pull, and
      # it won't have the proper authentication (written at v0.6.0)
      - name: Pulling compute-node image
        run: |
          docker pull ghcr.io/${{ github.repository_owner }}/compute-node-${{ matrix.version.pg }}:${{ needs.meta.outputs.build-tag }}

      - name: Build vm image
        run: |
          ./vm-builder \
            -size=2G \
            -spec=compute/vm-image-spec-${{ matrix.version.debian }}.yaml \
            -src=ghcr.io/${{ github.repository_owner }}/compute-node-${{ matrix.version.pg }}:${{ needs.meta.outputs.build-tag }} \
            -dst=ghcr.io/${{ github.repository_owner }}/vm-compute-node-${{ matrix.version.pg }}:${{ needs.meta.outputs.build-tag }}-${{ matrix.arch }} \
            -target-arch=linux/${{ matrix.arch }}

      - name: Pushing vm-compute-node image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/vm-compute-node-${{ matrix.version.pg }}:${{ needs.meta.outputs.build-tag }}-${{ matrix.arch }}

  vm-compute-node-image:
    needs: [ vm-compute-node-image-arch, meta, pg-versions ]
    if: ${{ contains(fromJSON('["push-main", "pr", "workflow-dispatch", "compute-rc-pr"]'), needs.meta.outputs.run-kind) }}
    permissions:
      packages: write
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        # see the comment for `compute-node-image-arch` job
        version: ${{ fromJSON(needs.pg-versions.outputs.compute) }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@4d991eb9b905ef189e4c376166672c3f2f230481 # v2.11.0
        with:
          egress-policy: audit

      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch compute-node image
        run: |
          docker buildx imagetools create -t ghcr.io/${{ github.repository_owner }}/vm-compute-node-${{ matrix.version.pg }}:${{ needs.meta.outputs.build-tag }} \
                                             ghcr.io/${{ github.repository_owner }}/vm-compute-node-${{ matrix.version.pg }}:${{ needs.meta.outputs.build-tag }}-amd64 \
                                             ghcr.io/${{ github.repository_owner }}/vm-compute-node-${{ matrix.version.pg }}:${{ needs.meta.outputs.build-tag }}-arm64


  test-images:
    needs: [ check-permissions, meta, pg-versions, neon-image, compute-node-image ]
    # Depends on jobs that can get skipped
    if: >-
      ${{
        !failure()
        && !cancelled()
        && contains(fromJSON('["push-main", "pr", "workflow-dispatch", "storage-rc-pr", "proxy-rc-pr", "compute-rc-pr"]'), needs.meta.outputs.run-kind)
        && needs.pg-versions.outputs.test-extensions != '[]'
      }}
    strategy:
      fail-fast: false
      matrix:
        arch: [ x64, arm64 ]
        # v16 and v17, if selected: see the `pg-versions` job
        pg_version: ${{ fromJSON(needs.pg-versions.outputs.test-extensions) }}

    permissions:
      packages: read

    runs-on: ${{ matrix.arch == 'arm64' && (startsWith(vars.RUNNER_SMALL_ARM64, '[') && fromJSON(vars.RUNNER_SMALL_ARM64) || vars.RUNNER_SMALL_ARM64 || 'ubuntu-22.04-arm') || (startsWith(vars.RUNNER_SMALL, '[') && fromJSON(vars.RUNNER_SMALL) || vars.RUNNER_SMALL || 'ubuntu-22.04') }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@4d991eb9b905ef189e4c376166672c3f2f230481 # v2.11.0
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2


      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `ghcr.io/neondatabase/neon` contains multiple binaries, all of them use the same input for the version into the same version formatting library.
      # Pick pageserver as currently the only binary with extra "version" features printed in the string to verify.
      # Regular pageserver version string looks like
      #   Neon page server git-env:32d14403bd6ab4f4520a94cbfd81a6acef7a526c failpoints: true, features: []
      # Bad versions might loop like:
      #   Neon page server git-env:local failpoints: true, features: ["testing"]
      # Ensure that we don't have bad versions.
      - name: Verify image versions
        shell: bash # ensure no set -e for better error messages
        if: ${{ contains(fromJSON('["push-main", "pr", "workflow-dispatch", "storage-rc-pr", "proxy-rc-pr"]'), needs.meta.outputs.run-kind) }}
        run: |
          pageserver_version=$(docker run --rm ghcr.io/${{ github.repository_owner }}/neon:${{ needs.meta.outputs.build-tag }} "/bin/sh" "-c" "/usr/local/bin/pageserver --version")

          echo "Pageserver version string: $pageserver_version"

          if ! echo "$pageserver_version" | grep -qv 'git-env:local' ; then
            echo "Pageserver version should not be the default Dockerfile one"
            exit 1
          fi

          if ! echo "$pageserver_version" | grep -qv '"testing"' ; then
            echo "Pageserver version should have no testing feature enabled"
            exit 1
          fi

      - name: Verify docker-compose example and test extensions
        timeout-minutes: 60
        env:
          PARALLEL_COMPUTES: 3
          TAG: >-
            ${{
              needs.meta.outputs.run-kind == 'compute-rc-pr'
              && needs.meta.outputs.previous-storage-release
              || needs.meta.outputs.build-tag
            }}
          COMPUTE_TAG: >-
            ${{
              contains(fromJSON('["storage-rc-pr", "proxy-rc-pr"]'), needs.meta.outputs.run-kind)
              && needs.meta.outputs.previous-compute-release
              || needs.meta.outputs.build-tag
            }}
          TEST_EXTENSIONS_TAG: >-
            ${{
              contains(fromJSON('["storage-rc-pr", "proxy-rc-pr"]'), needs.meta.outputs.run-kind)
              && needs.meta.outputs.previous-compute-release
              || needs.meta.outputs.build-tag
            }}
          TEST_VERSION_ONLY: ${{ matrix.pg_version }}
          # docker-compose.yml defaults to ghcr.io/neondatabase
          REPOSITORY: ghcr.io/${{ github.repository_owner }}
        run: ./docker-compose/docker_compose_test.sh

      - name: Print logs and clean up docker-compose test
        if: always()
        run: |
          docker compose --profile test-extensions -f ./docker-compose/docker-compose.yml logs || true
          docker compose --profile test-extensions -f ./docker-compose/docker-compose.yml down

      - name: Test extension upgrade
        timeout-minutes: 20
        # Needs a previous compute release to upgrade from, which this fork may not have (yet)
        if: ${{ contains(fromJSON('["pr", "workflow-dispatch", "compute-rc-pr"]'), needs.meta.outputs.run-kind) && needs.meta.outputs.previous-compute-release != '' }}
        env:
          TAG: >-
            ${{
              false
              || contains(fromJSON('["pr", "workflow-dispatch"]'), needs.meta.outputs.run-kind) && needs.meta.outputs.build-tag
              || needs.meta.outputs.run-kind == 'compute-rc-pr' && needs.meta.outputs.previous-storage-release
            }}
          TEST_EXTENSIONS_TAG: ${{ needs.meta.outputs.previous-compute-release }}
          NEW_COMPUTE_TAG: ${{ needs.meta.outputs.build-tag }}
          OLD_COMPUTE_TAG: ${{ needs.meta.outputs.previous-compute-release }}
          REPOSITORY: ghcr.io/${{ github.repository_owner }}
        run: ./docker-compose/test_extensions_upgrade.sh

      - name: Print logs and clean up
        if: always()
        run: |
          docker compose --profile test-extensions -f ./docker-compose/docker-compose.yml logs || true
          docker compose --profile test-extensions -f ./docker-compose/docker-compose.yml down

  generate-image-maps:
    needs: [ meta, pg-versions ]
    runs-on: ubuntu-22.04
    outputs:
      neon-dev: ${{ steps.generate.outputs.neon-dev }}
      compute-dev: ${{ steps.generate.outputs.compute-dev }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@4d991eb9b905ef189e4c376166672c3f2f230481 # v2.11.0
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          sparse-checkout: .github/scripts/generate_image_maps.py
          sparse-checkout-cone-mode: false

      - name: Generate Image Maps
        id: generate
        run: python3 .github/scripts/generate_image_maps.py
        env:
          SOURCE_TAG: >-
            ${{
              contains(fromJSON('["storage-release", "compute-release", "proxy-release"]'), needs.meta.outputs.run-kind)
              && needs.meta.outputs.release-pr-run-id
              || needs.meta.outputs.build-tag
            }}
          TARGET_TAG: ${{ needs.meta.outputs.build-tag }}
          BRANCH: "${{ github.ref_name }}"
          REGISTRY: ghcr.io/${{ github.repository_owner }}
          # Only the compute images of the selected Postgres versions are built: see the `pg-versions` job
          PG_VERSIONS: ${{ join(fromJSON(needs.pg-versions.outputs.versions), ',') }}

  push-neon-image-dev:
    needs: [ meta, generate-image-maps, neon-image ]
    if: ${{ !failure() && !cancelled() && contains(fromJSON('["push-main", "pr", "workflow-dispatch", "storage-release", "storage-rc-pr", "proxy-release", "proxy-rc-pr"]'), needs.meta.outputs.run-kind) }}
    uses: ./.github/workflows/_push-to-container-registry.yml
    permissions:
      packages: write  # required for pushing to GHCR
    with:
      image-map: '${{ needs.generate-image-maps.outputs.neon-dev }}'
    secrets: inherit

  push-compute-image-dev:
    needs: [ meta, generate-image-maps, vm-compute-node-image ]
    if: ${{ !failure() && !cancelled() && contains(fromJSON('["push-main", "pr", "workflow-dispatch", "compute-release", "compute-rc-pr"]'), needs.meta.outputs.run-kind) }}
    uses: ./.github/workflows/_push-to-container-registry.yml
    permissions:
      packages: write  # required for pushing to GHCR
    with:
      image-map: '${{ needs.generate-image-maps.outputs.compute-dev }}'
    secrets: inherit

  # Upstream's `push-neon-image-prod`, `push-compute-image-prod` and `push-neon-test-extensions-image-dockerhub`
  # jobs are dropped: they only push to Neon's production ECR/ACR registries and to Docker Hub.

  # The neon-test-extensions-v16/v17 images, if selected: see the `pg-versions` job
  add-latest-tag-to-neon-test-extensions-image:
    if: ${{ needs.meta.outputs.run-kind == 'push-main' && needs.pg-versions.outputs.test-extensions != '[]' }}
    needs: [ meta, pg-versions, compute-node-image ]
    uses: ./.github/workflows/_push-to-container-registry.yml
    permissions:
      packages: write
    with:
      image-map: ${{ needs.pg-versions.outputs.test-extensions-latest-map }}
    secrets: inherit

  add-release-tag-to-neon-test-extensions-image:
    if: ${{ needs.meta.outputs.run-kind == 'compute-release' && needs.pg-versions.outputs.test-extensions != '[]' }}
    needs: [ meta, pg-versions ]
    uses: ./.github/workflows/_push-to-container-registry.yml
    permissions:
      packages: write
    with:
      image-map: ${{ needs.pg-versions.outputs.test-extensions-release-map }}
    secrets: inherit

  # Upstream's `trigger-custom-extensions-build-and-wait` job is dropped: it builds extensions in the
  # private neondatabase/build-custom-extensions repo.

  deploy:
    needs: [ check-permissions, push-neon-image-dev, push-compute-image-dev, meta ]
    # `!failure() && !cancelled()` is required because the workflow depends on the job that can be skipped: `push-neon-image-dev` and `push-compute-image-dev`
    if: ${{ contains(fromJSON('["push-main", "storage-release", "proxy-release", "compute-release"]'), needs.meta.outputs.run-kind) && !failure() && !cancelled() }}
    permissions:
      statuses: write
      contents: write
    runs-on: ${{ startsWith(vars.RUNNER_SMALL, '[') && fromJSON(vars.RUNNER_SMALL) || vars.RUNNER_SMALL || 'ubuntu-22.04' }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@4d991eb9b905ef189e4c376166672c3f2f230481 # v2.11.0
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Create git tag and GitHub release
        if: ${{ contains(fromJSON('["storage-release", "proxy-release", "compute-release"]'), needs.meta.outputs.run-kind) }}
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          TAG: "${{ needs.meta.outputs.build-tag }}"
          BRANCH: "${{ github.ref_name }}"
          PREVIOUS_RELEASE: >-
            ${{
              false
              || needs.meta.outputs.run-kind == 'storage-release' && needs.meta.outputs.previous-storage-release
              || needs.meta.outputs.run-kind == 'proxy-release' && needs.meta.outputs.previous-proxy-release
              || needs.meta.outputs.run-kind == 'compute-release' && needs.meta.outputs.previous-compute-release
              || 'unknown'
            }}
        with:
          retries: 5
          script: |
            const { TAG, BRANCH, PREVIOUS_RELEASE } = process.env

            try {
              const existingRef = await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${TAG}`,
              });

              if (existingRef.data.object.sha !== context.sha) {
                throw new Error(`Tag ${TAG} already exists but points to a different commit (expected: ${context.sha}, actual: ${existingRef.data.object.sha}).`);
              }

              console.log(`Tag ${TAG} already exists and points to ${context.sha} as expected.`);
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }

              console.log(`Tag ${TAG} does not exist. Creating it...`);
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `refs/tags/${TAG}`,
                sha: context.sha,
              });
              console.log(`Tag ${TAG} created successfully.`);
            }

            try {
              const existingRelease = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: TAG,
              });

              console.log(`Release for tag ${TAG} already exists (ID: ${existingRelease.data.id}).`);
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }

              console.log(`Release for tag ${TAG} does not exist. Creating it...`);

              // Find the PR number using the commit SHA
              const pullRequests = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'closed',
                base: BRANCH,
              });

              const pr = pullRequests.data.find(pr => pr.merge_commit_sha === context.sha);
              const prNumber = pr ? pr.number : null;

              const releaseNotes = [
                prNumber
                  ? `Release PR https://github.com/${context.repo.owner}/${context.repo.repo}/pull/${prNumber}.`
                  : 'Release PR not found.',
                `Diff with the previous release https://github.com/${context.repo.owner}/${context.repo.repo}/compare/${PREVIOUS_RELEASE}...${TAG}.`
              ].join('\n\n');

              await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: TAG,
                body: releaseNotes,
              });
              console.log(`Release for tag ${TAG} created successfully.`);
            }

      # Upstream's "Trigger deploy workflow" step is dropped: it deploys through the private neondatabase/infra repo.

  # Upstream's `notify-release-deploy-failure` (Slack) and `promote-compatibility-data` (Neon's S3 bucket)
  # jobs are dropped.

  pin-build-tools-image:
    needs: [ build-build-tools-image, test-images, build-and-test-locally ]
    # `!failure() && !cancelled()` is required because the job (transitively) depends on jobs that can be skipped
    if: github.ref_name == 'main' && !failure() && !cancelled()
    # Reusable workflows can't get more permissions than their caller grants, and this repo's default
    # GITHUB_TOKEN is read-only (upstream's is read-write), so grant what the called jobs request.
    permissions:
      packages: write
    uses: ./.github/workflows/pin-build-tools-image.yml
    with:
      from-tag: ${{ needs.build-build-tools-image.outputs.image-tag }}
    secrets: inherit

  # This job simplifies setting branch protection rules (in GitHub UI)
  # by allowing to set only this job instead of listing many others.
  # It also makes it easier to rename or parametrise jobs (using matrix)
  # which requires changes in branch protection rules
  #
  # Note, that we can't add external check (like `neon-cloud-e2e`) we still need to use GitHub UI for that.
  #
  # https://github.com/neondatabase/neon/settings/branch_protection_rules
  conclusion:
    if: always()
    # Format `needs` differently to make the list more readable.
    # Usually we do `needs: [...]`
    needs:
      - meta
      - pg-versions
      - build-and-test-locally
      - check-codestyle-python
      - check-codestyle-rust
      - check-dependencies-rust
      - files-changed
      - push-compute-image-dev
      - push-neon-image-dev
      - test-images
    runs-on: ubuntu-22.04
    steps:
      # The list of possible results:
      # https://docs.github.com/en/actions/learn-github-actions/contexts#needs-context
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@4d991eb9b905ef189e4c376166672c3f2f230481 # v2.11.0
        with:
          egress-policy: audit

      - name: Fail the job if any of the dependencies do not succeed
        run: exit 1
        if: |
          contains(needs.*.result, 'failure')
          || contains(needs.*.result, 'cancelled')
          || (needs.check-dependencies-rust.result == 'skipped' && needs.files-changed.outputs.check-rust-dependencies == 'true' && contains(fromJSON('["pr", "workflow-dispatch", "storage-rc-pr", "proxy-rc-pr", "compute-rc-pr"]'), needs.meta.outputs.run-kind))
          || (needs.build-and-test-locally.result == 'skipped' && contains(fromJSON('["pr", "workflow-dispatch", "push-main", "storage-rc-pr", "proxy-rc-pr", "compute-rc-pr"]'), needs.meta.outputs.run-kind))
          || (needs.check-codestyle-python.result == 'skipped' && contains(fromJSON('["pr", "workflow-dispatch", "storage-rc-pr", "proxy-rc-pr", "compute-rc-pr"]'), needs.meta.outputs.run-kind))
          || (needs.check-codestyle-rust.result == 'skipped' && contains(fromJSON('["pr", "workflow-dispatch", "storage-rc-pr", "proxy-rc-pr", "compute-rc-pr"]'), needs.meta.outputs.run-kind))
          || needs.files-changed.result == 'skipped'
          || (needs.push-compute-image-dev.result == 'skipped' && contains(fromJSON('["push-main", "pr", "workflow-dispatch", "compute-release", "compute-rc-pr"]'), needs.meta.outputs.run-kind))
          || (needs.push-neon-image-dev.result == 'skipped' && contains(fromJSON('["push-main", "pr", "workflow-dispatch", "storage-release", "storage-rc-pr", "proxy-release", "proxy-rc-pr"]'), needs.meta.outputs.run-kind))
          || (needs.test-images.result == 'skipped' && contains(fromJSON('["push-main", "pr", "workflow-dispatch", "storage-rc-pr", "proxy-rc-pr", "compute-rc-pr"]'), needs.meta.outputs.run-kind) && needs.pg-versions.outputs.test-extensions != '[]')
