  # This fork's `promote-compatibility-data`: the release PR run keeps the compatibility snapshots and Neon
  # artifacts as GitHub Actions artifacts of that run, and this job pushes them to GHCR as OCI artifacts in
  # ghcr.io/<owner>/neon-compat-data, tagged `<artifact name>-<release tag>` and `<artifact name>-latest`.
  # The `download` action's `prefix: latest` pulls the latter.
  promote-compatibility-data:
    needs: [ meta, deploy, pg-versions ]
    permissions:
      actions: read # the release PR run's artifacts
      packages: write # GHCR
      contents: read
    # `!failure() && !cancelled()` is required because the workflow transitively depends on the job that can be skipped: `push-neon-image-dev` and `push-compute-image-dev`
    if: github.ref_name == 'release' && !failure() && !cancelled()

    runs-on: ubuntu-22.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@4d991eb9b905ef189e4c376166672c3f2f230481 # v2.11.0
        with:
          egress-policy: audit

      # The x64 debug Neon artifact alone is ~6GB, and it is downloaded and repacked here
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Set up ORAS
        uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2

      - name: Promote compatibility snapshot and Neon artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          REPOSITORY: ghcr.io/${{ github.repository_owner }}/neon-compat-data
          RELEASE_TAG: ${{ needs.meta.outputs.build-tag }}
          RUN_ID: ${{ needs.meta.outputs.release-pr-run-id }}
          PG_VERSIONS: ${{ needs.pg-versions.outputs.versions }}
        run: |
          REPOSITORY=${REPOSITORY,,}
          echo "${GH_TOKEN}" | oras login ghcr.io --username "${ACTOR}" --password-stdin

          artifacts=()
          for arch in X64 ARM64; do
            for build_type in debug release; do
              # Only x64 runs the debug regress tests, so the ARM64 debug artifact isn't needed
              if [ "${build_type}" == "debug" ] && [ "${arch}" == "ARM64" ]; then
                continue
              fi
              artifacts+=("neon-Linux-${arch}-${build_type}-artifact")

              # The Postgres versions the release PR run tested (the PG_VERSIONS variable, or all)
              for pg_version in $(jq -r '.[]' <<< "${PG_VERSIONS}"); do
                # We run less tests for debug builds, so we don't need to promote them
                if [ "${build_type}" == "debug" ] && [ "${pg_version}" != "v17" ]; then
                  continue
                fi
                artifacts+=("compatibility-snapshot-${arch}-${build_type}-pg${pg_version}")
              done
            done
          done

          for name in "${artifacts[@]}"; do
            workdir=$(mktemp -d)
            # Each artifact holds a single `<name>.tar.zst` (see the `upload` action)
            if ! gh run download "${RUN_ID}" --repo "${GITHUB_REPOSITORY}" --name "${name}" --dir "${workdir}"; then
              # The x64 debug regress tests may fail, and then leave no snapshot: debug builds skip the checks
              # that need it (see test_compatibility.py). Everything else is required.
              if [[ "${name}" == compatibility-snapshot-*-debug-* ]]; then
                echo "::warning::${name} is missing from run ${RUN_ID}, not promoting it"
                rm -rf "${workdir}"
                continue
              fi
              exit 1
            fi

            if [[ "${name}" == neon-Linux-* ]]; then
              # The compatibility tests only use the previous release's bin/ and pg_install/: drop the rest,
              # like the debug build's unit test binaries (most of its size)
              mkdir "${workdir}/neon"
              time tar -xf "${workdir}/${name}.tar.zst" -C "${workdir}/neon" ./bin ./pg_install
              rm "${workdir}/${name}.tar.zst"
              time tar -C "${workdir}/neon" -cf "${workdir}/${name}.tar.zst" -I 'zstd -T0' .
              rm -rf "${workdir}/neon"
            fi

            echo "${name}.tar.zst $(du -h "${workdir}/${name}.tar.zst" | cut -f1)" | tee -a "${GITHUB_STEP_SUMMARY}"
            # Pushed from its directory, so that the file is pulled back as `<name>.tar.zst`
            (
              cd "${workdir}"
              time oras push \
                --artifact-type application/vnd.neon.compatibility-data.v1 \
                --annotation "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
                "${REPOSITORY}:${name}-${RELEASE_TAG},${name}-latest" \
                "${name}.tar.zst:application/zstd"
            )
            rm -rf "${workdir}"
          done

  pin-build-tools-image:
    needs: [ build-build-tools-image, test-images, build-and-test-locally ]
    # `!failure() && !cancelled()` is required because the job (transitively) depends on jobs that can be skipped
    if: github.ref_name == 'main' && !failure() && !cancelled()
    # Reusable workflows can't get more permissions than their caller grants, and this repo's default
    # GITHUB_TOKEN is read-only (upstream's is read-write), so grant what the called jobs request.
    permissions:
      packages: write
    uses: ./.github/workflows/pin-build-tools-image.yml
    with:
      from-tag: ${{ needs.build-build-tools-image.outputs.image-tag }}
    secrets: inherit

  # This job simplifies setting branch protection rules (in GitHub UI)
  # by allowing to set only this job instead of listing many others.
  # It also makes it easier to rename or parametrise jobs (using matrix)
  # which requires changes in branch protection rules
  #
  # Note, that we can't add external check (like `neon-cloud-e2e`) we still need to use GitHub UI for that.
  #
  # https://github.com/neondatabase/neon/settings/branch_protection_rules
  conclusion:
    if: always()
    # Format `needs` differently to make the list more readable.
    # Usually we do `needs: [...]`
    needs:
      - meta
      - pg-versions
      - build-and-test-locally
      - check-codestyle-python
      - check-codestyle-rust
      - check-dependencies-rust
      - files-changed
      - push-compute-image-dev
      - push-neon-image-dev
      - test-images
      # Dropped: it needs Neon's private repo (see above)
      # - trigger-custom-extensions-build-and-wait
    runs-on: ubuntu-22.04
    steps:
      # The list of possible results:
      # https://docs.github.com/en/actions/learn-github-actions/contexts#needs-context
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@4d991eb9b905ef189e4c376166672c3f2f230481 # v2.11.0
        with:
          egress-policy: audit

      - name: Fail the job if any of the dependencies do not succeed
        run: exit 1
        # Manually dispatched runs (`workflow-dispatch`) must not skip these checks either, test-images is
        # skipped when there are no extensions to test, and `trigger-custom-extensions-build-and-wait` is
        # dropped (it needs Neon's private repo); upstream's:
        #   || (needs.check-dependencies-rust.result == 'skipped' && needs.files-changed.outputs.check-rust-dependencies == 'true' && contains(fromJSON('["pr", "storage-rc-pr", "proxy-rc-pr", "compute-rc-pr"]'), needs.meta.outputs.run-kind))
        #   || (needs.build-and-test-locally.result == 'skipped' && contains(fromJSON('["pr", "push-main", "storage-rc-pr", "proxy-rc-pr", "compute-rc-pr"]'), needs.meta.outputs.run-kind))
        #   || (needs.check-codestyle-python.result == 'skipped' && contains(fromJSON('["pr", "storage-rc-pr", "proxy-rc-pr", "compute-rc-pr"]'), needs.meta.outputs.run-kind))
        #   || (needs.check-codestyle-rust.result == 'skipped' && contains(fromJSON('["pr", "storage-rc-pr", "proxy-rc-pr", "compute-rc-pr"]'), needs.meta.outputs.run-kind))
        #   || (needs.push-compute-image-dev.result == 'skipped' && contains(fromJSON('["push-main", "pr", "compute-release", "compute-rc-pr"]'), needs.meta.outputs.run-kind))
        #   || (needs.push-neon-image-dev.result == 'skipped' && contains(fromJSON('["push-main", "pr", "storage-release", "storage-rc-pr", "proxy-release", "proxy-rc-pr"]'), needs.meta.outputs.run-kind))
        #   || (needs.test-images.result == 'skipped' && contains(fromJSON('["push-main", "pr", "storage-rc-pr", "proxy-rc-pr", "compute-rc-pr"]'), needs.meta.outputs.run-kind))
        #   || (needs.trigger-custom-extensions-build-and-wait.result == 'skipped' && contains(fromJSON('["push-main", "pr", "compute-release", "compute-rc-pr"]'), needs.meta.outputs.run-kind))
        if: |
          contains(needs.*.result, 'failure')
          || contains(needs.*.result, 'cancelled')
          || (needs.check-dependencies-rust.result == 'skipped' && needs.files-changed.outputs.check-rust-dependencies == 'true' && contains(fromJSON('["pr", "workflow-dispatch", "storage-rc-pr", "proxy-rc-pr", "compute-rc-pr"]'), needs.meta.outputs.run-kind))
          || (needs.build-and-test-locally.result == 'skipped' && contains(fromJSON('["pr", "workflow-dispatch", "push-main", "storage-rc-pr", "proxy-rc-pr", "compute-rc-pr"]'), needs.meta.outputs.run-kind))
          || (needs.check-codestyle-python.result == 'skipped' && contains(fromJSON('["pr", "workflow-dispatch", "storage-rc-pr", "proxy-rc-pr", "compute-rc-pr"]'), needs.meta.outputs.run-kind))
          || (needs.check-codestyle-rust.result == 'skipped' && contains(fromJSON('["pr", "workflow-dispatch", "storage-rc-pr", "proxy-rc-pr", "compute-rc-pr"]'), needs.meta.outputs.run-kind))
          || needs.files-changed.result == 'skipped'
          || (needs.push-compute-image-dev.result == 'skipped' && contains(fromJSON('["push-main", "pr", "workflow-dispatch", "compute-release", "compute-rc-pr"]'), needs.meta.outputs.run-kind))
          || (needs.push-neon-image-dev.result == 'skipped' && contains(fromJSON('["push-main", "pr", "workflow-dispatch", "storage-release", "storage-rc-pr", "proxy-release", "proxy-rc-pr"]'), needs.meta.outputs.run-kind))
          || (needs.test-images.result == 'skipped' && contains(fromJSON('["push-main", "pr", "workflow-dispatch", "storage-rc-pr", "proxy-rc-pr", "compute-rc-pr"]'), needs.meta.outputs.run-kind) && needs.pg-versions.outputs.test-extensions != '[]')
