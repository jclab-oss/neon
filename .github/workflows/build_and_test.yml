      #         -f deployProxy=false \
      #         -f deployStorage=true \
      #         -f deployStorageBroker=false \
      #         -f deployStorageController=true \
      #         -f branch=main \
      #         -f dockerTag=${{needs.meta.outputs.build-tag}} \
      #         -f deployPreprodRegion=true

  # Upstream's `notify-release-deploy-failure` (Slack) job is dropped, and its `promote-compatibility-data`
  # (Neon's S3 bucket) is replaced by a job of the same name that promotes to GHCR (after it, below).
  #           gh workflow --repo neondatabase/infra run deploy-prod.yml --ref main \
  #             -f deployStorage=true \
  #             -f deployStorageBroker=false \
