  create-test-report:
    # `benchmarks` is dropped (see above)
    # needs: [ check-permissions, build-and-test-locally, coverage-report, build-build-tools-image, benchmarks ]
    needs: [ check-permissions, build-and-test-locally, coverage-report, build-build-tools-image ]
    if: ${{ !cancelled() && contains(fromJSON('["skipped", "success"]'), needs.check-permissions.result) }}
    permissions:
      # No OIDC token needed: this fork has no access to AWS/Azure
      # id-token: write # aws-actions/configure-aws-credentials
      statuses: write
      contents: write
      pull-requests: write
    outputs:
      report-url: ${{ steps.create-allure-report.outputs.report-url }}

    # Upstream's self-hosted runner labels; here runners come from the RUNNER_* repository variables (see .github/actionlint.yml)
    # runs-on: [ self-hosted, small ]
    runs-on: ${{ startsWith(vars.RUNNER_SMALL, '[') && fromJSON(vars.RUNNER_SMALL) || vars.RUNNER_SMALL || 'ubuntu-22.04' }}
    container:
      image: ${{ needs.build-build-tools-image.outputs.image }}-bookworm
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # This fork's runners (GitHub-hosted and self-hosted alike) run as uid 1001 and own the workspace,
      # /__w/_temp and /github/home, while the build-tools image runs as `nonroot` (uid 1000): run as 1001
      # (non-root, as initdb requires) and borrow the host's passwd entry for it.
      # options: --init
      options: --init --user 1001:1001
      volumes:
        - /etc/passwd:/etc/passwd:ro

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@4d991eb9b905ef189e4c376166672c3f2f230481 # v2.11.0
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Create Allure report
        if: ${{ !cancelled() }}
        id: create-allure-report
        uses: ./.github/actions/allure-report-generate
        # Upstream also stores the results into its internal test-results database (`store-test-results-into-db`)
        # with:
        #   store-test-results-into-db: true
        #   aws-oidc-role-arn: ${{ vars.DEV_AWS_OIDC_ROLE_ARN }}
        # env:
        #   REGRESS_TEST_RESULT_CONNSTR_NEW: ${{ secrets.REGRESS_TEST_RESULT_CONNSTR_NEW }}

      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        if: ${{ !cancelled() }}
        with:
          # Retry script for 5XX server errors: https://github.com/actions/github-script#retries
          retries: 5
          script: |
            const report = {
              reportUrl:     "${{ steps.create-allure-report.outputs.report-url }}",
              reportJsonUrl: "${{ steps.create-allure-report.outputs.report-json-url }}",
            }

            const coverage = {
              coverageUrl: "${{ needs.coverage-report.outputs.coverage-html }}",
              summaryJsonUrl: "${{ needs.coverage-report.outputs.coverage-json }}",
            }

            // The Allure report JSON is a local file here (upstream serves it from S3), which `fetch` can't read
            const fs = require("fs")
            const fetchOrReadFile = async (url) => url.startsWith("/")
              ? { json: async () => JSON.parse(fs.readFileSync(url, "utf8")) }
              : fetch(url)

            const script = require("./scripts/comment-test-report.js")
            await script({
              github,
              context,
              // fetch,
              fetch: fetchOrReadFile,
              report,
              coverage,
            })

  coverage-report:
    if: ${{ !startsWith(github.ref_name, 'release') }}
    needs: [ check-permissions, build-build-tools-image, build-and-test-locally ]
    permissions:
      # No OIDC token needed: this fork has no access to AWS/Azure
      # id-token: write # aws-actions/configure-aws-credentials
      statuses: write
      contents: write
    # Upstream's self-hosted runner labels; here runners come from the RUNNER_* repository variables (see .github/actionlint.yml)
    # runs-on: [ self-hosted, small ]
    runs-on: ${{ startsWith(vars.RUNNER_SMALL, '[') && fromJSON(vars.RUNNER_SMALL) || vars.RUNNER_SMALL || 'ubuntu-22.04' }}
    container:
      image: ${{ needs.build-build-tools-image.outputs.image }}-bookworm
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # This fork's runners (GitHub-hosted and self-hosted alike) run as uid 1001 and own the workspace,
      # /__w/_temp and /github/home, while the build-tools image runs as `nonroot` (uid 1000): run as 1001
      # (non-root, as initdb requires) and borrow the host's passwd entry for it.
      # options: --init
      options: --init --user 1001:1001
      volumes:
        - /etc/passwd:/etc/passwd:ro
    strategy:
      fail-fast: false
      matrix:
        build_type: [ debug ]
    outputs:
        # The report is the `coverage-report` artifact, see below
        # coverage-html: ${{ steps.upload-coverage-report-new.outputs.report-url }}
        coverage-html: ${{ steps.upload-coverage-report-new.outputs.artifact-url }}
        # See below
        # coverage-json: ${{ steps.upload-coverage-report-new.outputs.summary-json }}
        coverage-json: ${{ steps.build-coverage-report-new.outputs.summary-json }}
    steps:
      # Need `fetch-depth: 0` for differential coverage (to get diff between two commits)
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@4d991eb9b905ef189e4c376166672c3f2f230481 # v2.11.0
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: true
          fetch-depth: 0

      - name: Get Neon artifact
        uses: ./.github/actions/download
        with:
          name: neon-${{ runner.os }}-${{ runner.arch }}-${{ matrix.build_type }}-artifact
          path: /tmp/neon
          # This fork has no access to AWS/S3
          # aws-oidc-role-arn: ${{ vars.DEV_AWS_OIDC_ROLE_ARN }}

      - name: Get coverage artifact
        uses: ./.github/actions/download
        with:
          name: coverage-data-artifact
          path: /tmp/coverage
          # This fork has no access to AWS/S3
          # aws-oidc-role-arn: ${{ vars.DEV_AWS_OIDC_ROLE_ARN }}

      - name: Merge coverage data
        run: scripts/coverage "--profraw-prefix=$GITHUB_JOB" --dir=/tmp/coverage merge

      - name: Build coverage report
        env:
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          scripts/coverage --dir=/tmp/coverage \
            report \
            --input-objects=/tmp/coverage/binaries.list \
            --commit-url=${COMMIT_URL} \
            --format=github

          scripts/coverage --dir=/tmp/coverage \
            report \
            --input-objects=/tmp/coverage/binaries.list \
            --format=lcov

      # Upstream publishes the HTML report to (and takes the baseline for a differential report from)
      # Neon's S3 bucket. Here the report is a GitHub Actions artifact of the run, without a baseline.
      # - name: Build coverage report NEW
      #   id: upload-coverage-report-new
      #   env:
      #     BUCKET: neon-github-public-dev
      #     # A differential coverage report is available only for PRs.
      #     # (i.e. for pushes into main/release branches we have a regular coverage report)
      #     COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      #     BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
      #   run: |
      #     CURRENT="${COMMIT_SHA}"
      #     BASELINE="$(git merge-base $BASE_SHA $CURRENT)"
      #
      #     cp /tmp/coverage/report/lcov.info ./${CURRENT}.info
      #
      #     GENHTML_ARGS="--ignore-errors path,unmapped,empty --synthesize-missing --demangle-cpp rustfilt --output-directory lcov-html ${CURRENT}.info"
      #
      #     # Use differential coverage if the baseline coverage exists.
      #     # It can be missing if the coverage repoer wasn't uploaded yet or tests has failed on BASELINE commit.
      #     if aws s3 cp --only-show-errors s3://${BUCKET}/code-coverage/${BASELINE}/lcov.info ./${BASELINE}.info; then
      #       git diff ${BASELINE} ${CURRENT} -- '*.rs' > baseline-current.diff
      #
      #       GENHTML_ARGS="--baseline-file ${BASELINE}.info --diff-file baseline-current.diff ${GENHTML_ARGS}"
      #     fi
      #
      #     genhtml ${GENHTML_ARGS}
      #
      #     aws s3 cp --only-show-errors --recursive ./lcov-html/ s3://${BUCKET}/code-coverage/${COMMIT_SHA}/lcov
      #
      #     REPORT_URL=https://${BUCKET}.s3.amazonaws.com/code-coverage/${COMMIT_SHA}/lcov/index.html
      #     echo "report-url=${REPORT_URL}" >> $GITHUB_OUTPUT
      #
      #     REPORT_URL=https://${BUCKET}.s3.amazonaws.com/code-coverage/${COMMIT_SHA}/lcov/summary.json
      #     echo "summary-json=${REPORT_URL}" >> $GITHUB_OUTPUT

      - name: Build coverage report NEW
        id: build-coverage-report-new
        env:
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          CURRENT="${COMMIT_SHA}"

          cp /tmp/coverage/report/lcov.info ./${CURRENT}.info

          GENHTML_ARGS="--ignore-errors path,unmapped,empty --synthesize-missing --demangle-cpp rustfilt --output-directory lcov-html ${CURRENT}.info"

          genhtml ${GENHTML_ARGS}

          # The summary is small, so hand it over inline (as a data: URL) for scripts/comment-test-report.js to `fetch`
          if [ -f lcov-html/summary.json ] && [ "$(stat -c %s lcov-html/summary.json)" -lt 262144 ]; then
            echo "summary-json=data:application/json;base64,$(base64 -w0 lcov-html/summary.json)" >> $GITHUB_OUTPUT
          fi

      - name: Upload coverage report NEW
        id: upload-coverage-report-new
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: lcov-html/
          overwrite: true

      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          # The report is the `coverage-report` artifact
          # REPORT_URL_NEW: ${{ steps.upload-coverage-report-new.outputs.report-url }}
          REPORT_URL_NEW: ${{ steps.upload-coverage-report-new.outputs.artifact-url }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        with:
          # Retry script for 5XX server errors: https://github.com/actions/github-script#retries
          retries: 5
          script: |
            const { REPORT_URL_NEW, COMMIT_SHA } = process.env

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: `${COMMIT_SHA}`,
              state: 'success',
              target_url: `${REPORT_URL_NEW}`,
              context: 'Code coverage report NEW',
            })

  # Upstream's `trigger-e2e-tests` job is dropped: it runs e2e tests in the private neondatabase/cloud repo.
  # trigger-e2e-tests:
  #   # !failure() && !cancelled() because it depends on jobs that can get skipped
  #   if: >-
  #     ${{
  #       (
  #         (
  #           needs.meta.outputs.run-kind == 'pr'
  #           && (
  #             !github.event.pull_request.draft
  #             || contains(github.event.pull_request.labels.*.name, 'run-e2e-tests-in-draft')
  #           )
  #         )
  #         || contains(fromJSON('["push-main", "storage-rc-pr", "proxy-rc-pr", "compute-rc-pr"]'), needs.meta.outputs.run-kind)
  #       )
  #       && !failure() && !cancelled()
  #     }}
  #   needs: [ check-permissions, push-neon-image-dev, push-compute-image-dev, meta ]
  #   uses: ./.github/workflows/trigger-e2e-tests.yml
  #   with:
  #     github-event-name: ${{ github.event_name }}
  #     github-event-json: ${{ toJSON(github.event) }}
  #   secrets: inherit

  neon-image-arch:
    needs: [ check-permissions, build-build-tools-image, meta ]
    # Also for manual runs (run-kind `workflow-dispatch`)
    # if: ${{ contains(fromJSON('["push-main", "pr", "storage-rc-pr", "proxy-rc-pr"]'), needs.meta.outputs.run-kind) }}
    if: ${{ contains(fromJSON('["push-main", "pr", "workflow-dispatch", "storage-rc-pr", "proxy-rc-pr"]'), needs.meta.outputs.run-kind) }}
    strategy:
      matrix:
        arch: [ x64, arm64 ]

    # Upstream's self-hosted runner labels; here runners come from the RUNNER_* repository variables (see .github/actionlint.yml)
    # runs-on: ${{ fromJSON(format('["self-hosted", "{0}"]', matrix.arch == 'arm64' && 'large-arm64' || 'large')) }}
    runs-on: ${{ matrix.arch == 'arm64' && (startsWith(vars.RUNNER_LARGE_ARM64, '[') && fromJSON(vars.RUNNER_LARGE_ARM64) || vars.RUNNER_LARGE_ARM64 || 'ubuntu-22.04-arm') || (startsWith(vars.RUNNER_LARGE, '[') && fromJSON(vars.RUNNER_LARGE) || vars.RUNNER_LARGE || 'ubuntu-22.04') }}

    permissions:
      packages: write

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@4d991eb9b905ef189e4c376166672c3f2f230481 # v2.11.0
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: true
          ref: ${{ needs.meta.outputs.sha }}

      # Only needed on Neon's shared self-hosted runners; the default Docker config directory is used here
      # - uses: neondatabase/dev-actions/set-docker-config-dir@6094485bf440001c94a94a3f9e221e81ff6b6193
      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
        with:
          cache-binary: false

      # No login to Neon's private registries (Docker Hub, cache.neon.build, ECR, ACR): this fork only pushes to GHCR
      # - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
      #   with:
      #     username: ${{ secrets.NEON_DOCKERHUB_USERNAME }}
      #     password: ${{ secrets.NEON_DOCKERHUB_PASSWORD }}

      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No login to Neon's private registries (Docker Hub, cache.neon.build, ECR, ACR): this fork only pushes to GHCR
      # - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
      #   with:
      #     registry: cache.neon.build
      #     username: ${{ secrets.NEON_CI_DOCKERCACHE_USERNAME }}
      #     password: ${{ secrets.NEON_CI_DOCKERCACHE_PASSWORD }}

      # The layer cache goes to the DOCKER_CACHE_REGISTRY repository variable's registry if set, else to GHCR
      - name: Pick the layer cache
        id: cache
        uses: ./.github/actions/docker-cache-registry
        with:
          cache-registry: ${{ vars.DOCKER_CACHE_REGISTRY }}
          image: neon
          flavor: bookworm-${{ matrix.arch }}

      - uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          # ARM-specific flags are recommended for Graviton ≥ 2, these flags are also supported by Ampere Altra (Azure)
          # https://github.com/aws/aws-graviton-getting-started/blob/57dc813626d0266f1cc12ef83474745bb1f31fb4/rust.md
          build-args: |
            ADDITIONAL_RUSTFLAGS=${{ matrix.arch == 'arm64' && '-Ctarget-feature=+lse -Ctarget-cpu=neoverse-n1' || '' }}
            GIT_VERSION=${{ github.event.pull_request.head.sha || github.sha }}
            BUILD_TAG=${{ needs.meta.outputs.release-tag || needs.meta.outputs.build-tag }}
            REPOSITORY=ghcr.io/${{ github.repository_owner }}
            TAG=${{ needs.build-build-tools-image.outputs.image-tag }}-bookworm
            DEBIAN_VERSION=bookworm
            IO_ALIGNMENT=${{ vars.IO_ALIGNMENT || '512' }}
          # No SUBZERO_ACCESS_TOKEN secret: the Dockerfile then builds against the in-tree subzero-core stub
          # secrets: |
          #   SUBZERO_ACCESS_TOKEN=${{ secrets.CI_ACCESS_TOKEN }}
          attests: |
            type=provenance,mode=max
            type=sbom,generator=docker.io/docker/buildkit-syft-scanner:1
          push: true
          pull: true
          file: Dockerfile
          # Upstream keeps its layer cache in the private cache.neon.build registry; keep it in DOCKER_CACHE_REGISTRY
          # (or next to the image in GHCR) instead, see the docker-cache-registry action.
          # PRs also keep a cache of their own (cache-pr<N>-*), read on top of main's and never written to main's.
          # cache-from: type=registry,ref=cache.neon.build/neon:cache-bookworm-${{ matrix.arch }}
          # cache-to: ${{ github.ref_name == 'main' && format('type=registry,ref=cache.neon.build/neon:cache-{0}-{1},mode=max', 'bookworm', matrix.arch) || '' }}
          cache-from: ${{ steps.cache.outputs.cache-from }}
          cache-to: ${{ steps.cache.outputs.cache-to }}
          # Images live in this repository owner's GHCR namespace instead of `neondatabase`
          # ghcr.io/neondatabase/neon:${{ needs.meta.outputs.build-tag }}-bookworm-${{ matrix.arch }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/neon:${{ needs.meta.outputs.build-tag }}-bookworm-${{ matrix.arch }}

  neon-image:
    needs: [ neon-image-arch, meta ]
    # Also for manual runs (run-kind `workflow-dispatch`)
    # if: ${{ contains(fromJSON('["push-main", "pr", "storage-rc-pr", "proxy-rc-pr"]'), needs.meta.outputs.run-kind) }}
    if: ${{ contains(fromJSON('["push-main", "pr", "workflow-dispatch", "storage-rc-pr", "proxy-rc-pr"]'), needs.meta.outputs.run-kind) }}
    runs-on: ubuntu-22.04
    permissions:
      # No OIDC token needed: this fork has no access to AWS/Azure
      # id-token: write # aws-actions/configure-aws-credentials
      statuses: write
      contents: read
      packages: write

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@4d991eb9b905ef189e4c376166672c3f2f230481 # v2.11.0
        with:
          egress-policy: audit

      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch image
        run: |
          # Images live in this repository owner's GHCR namespace instead of `neondatabase`
          # docker buildx imagetools create -t ghcr.io/neondatabase/neon:${{ needs.meta.outputs.build-tag }} \
          #                                 -t ghcr.io/neondatabase/neon:${{ needs.meta.outputs.build-tag }}-bookworm \
          #                                    ghcr.io/neondatabase/neon:${{ needs.meta.outputs.build-tag }}-bookworm-x64 \
          #                                    ghcr.io/neondatabase/neon:${{ needs.meta.outputs.build-tag }}-bookworm-arm64
          docker buildx imagetools create -t ghcr.io/${{ github.repository_owner }}/neon:${{ needs.meta.outputs.build-tag }} \
                                          -t ghcr.io/${{ github.repository_owner }}/neon:${{ needs.meta.outputs.build-tag }}-bookworm \
                                             ghcr.io/${{ github.repository_owner }}/neon:${{ needs.meta.outputs.build-tag }}-bookworm-x64 \
                                             ghcr.io/${{ github.repository_owner }}/neon:${{ needs.meta.outputs.build-tag }}-bookworm-arm64

  compute-node-image-arch:
    # Also needs the Postgres versions selected by the `pg-versions` job
    # needs: [ check-permissions, meta ]
    needs: [ check-permissions, meta, pg-versions ]
    # Also for manual runs (run-kind `workflow-dispatch`), and for release PRs of all components
    # (`rc/release-all/*`, see release.yml), which release compute too
    # if: ${{ contains(fromJSON('["push-main", "pr", "compute-rc-pr"]'), needs.meta.outputs.run-kind) }}
    if: ${{ contains(fromJSON('["push-main", "pr", "workflow-dispatch", "compute-rc-pr"]'), needs.meta.outputs.run-kind) || (needs.meta.outputs.run-kind == 'storage-rc-pr' && startsWith(github.head_ref, 'rc/release-all/')) }}
    permissions:
      # No OIDC token needed: this fork has no access to AWS/Azure
      # id-token: write # aws-actions/configure-aws-credentials
      statuses: write
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        # The selected Postgres versions, each with its Debian version: see the `pg-versions` job.
        # version:
        #   # Much data was already generated on old PG versions with bullseye's
        #   # libraries, the locales of which can cause data incompatibilities.
        #   # However, new PG versions should be build on newer images,
        #   # as that reduces the support burden of old and ancient distros.
        #   - pg: v14
        #     debian: bullseye
        #   - pg: v15
        #     debian: bullseye
        #   - pg: v16
        #     debian: bullseye
        #   - pg: v17
        #     debian: bookworm
        version: ${{ fromJSON(needs.pg-versions.outputs.compute) }}
        arch: [ x64, arm64 ]

    # Upstream's self-hosted runner labels; here runners come from the RUNNER_* repository variables (see .github/actionlint.yml)
    # runs-on: ${{ fromJSON(format('["self-hosted", "{0}"]', matrix.arch == 'arm64' && 'large-arm64' || 'large')) }}
    runs-on: ${{ matrix.arch == 'arm64' && (startsWith(vars.RUNNER_LARGE_ARM64, '[') && fromJSON(vars.RUNNER_LARGE_ARM64) || vars.RUNNER_LARGE_ARM64 || 'ubuntu-22.04-arm') || (startsWith(vars.RUNNER_LARGE, '[') && fromJSON(vars.RUNNER_LARGE) || vars.RUNNER_LARGE || 'ubuntu-22.04') }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@4d991eb9b905ef189e4c376166672c3f2f230481 # v2.11.0
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: true
          ref: ${{ needs.meta.outputs.sha }}

      # Only needed on Neon's shared self-hosted runners; the default Docker config directory is used here
      # - uses: neondatabase/dev-actions/set-docker-config-dir@6094485bf440001c94a94a3f9e221e81ff6b6193
      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
        with:
          cache-binary: false
          # Disable parallelism for docker buildkit.
          # As we already build everything with `make -j$(nproc)`, running it in additional level of parallelisam blows up the Runner.
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 1

      # No login to Neon's private registries (Docker Hub, cache.neon.build, ECR, ACR): this fork only pushes to GHCR
      # - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
      #   with:
      #     username: ${{ secrets.NEON_DOCKERHUB_USERNAME }}
      #     password: ${{ secrets.NEON_DOCKERHUB_PASSWORD }}

      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No login to Neon's private registries (Docker Hub, cache.neon.build, ECR, ACR): this fork only pushes to GHCR
      # - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
      #   with:
      #     registry: cache.neon.build
      #     username: ${{ secrets.NEON_CI_DOCKERCACHE_USERNAME }}
      #     password: ${{ secrets.NEON_CI_DOCKERCACHE_PASSWORD }}

      # The layer cache goes to the DOCKER_CACHE_REGISTRY repository variable's registry if set, else to GHCR
      - name: Pick the layer cache
        id: cache
        uses: ./.github/actions/docker-cache-registry
        with:
          cache-registry: ${{ vars.DOCKER_CACHE_REGISTRY }}
          image: compute-node-${{ matrix.version.pg }}
          flavor: ${{ matrix.version.debian }}-${{ matrix.arch }}

      - name: Build compute-node image
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          build-args: |
            GIT_VERSION=${{ github.event.pull_request.head.sha || github.sha }}
            PG_VERSION=${{ matrix.version.pg }}
            BUILD_TAG=${{ needs.meta.outputs.release-tag || needs.meta.outputs.build-tag }}
            DEBIAN_VERSION=${{ matrix.version.debian }}
          attests: |
            type=provenance,mode=max
            type=sbom,generator=docker.io/docker/buildkit-syft-scanner:1
          push: true
          pull: true
          file: compute/compute-node.Dockerfile
          # Upstream keeps its layer cache in the private cache.neon.build registry; keep it in DOCKER_CACHE_REGISTRY
          # (or next to the image in GHCR) instead, see the docker-cache-registry action.
          # PRs also keep a cache of their own (cache-pr<N>-*), read on top of main's and never written to main's.
          # cache-from: type=registry,ref=cache.neon.build/compute-node-${{ matrix.version.pg }}:cache-${{ matrix.version.debian }}-${{ matrix.arch }}
          # cache-to: ${{ github.ref_name == 'main' && format('type=registry,ref=cache.neon.build/compute-node-{0}:cache-{1}-{2},mode=max', matrix.version.pg, matrix.version.debian, matrix.arch) || '' }}
          cache-from: ${{ steps.cache.outputs.cache-from }}
          cache-to: ${{ steps.cache.outputs.cache-to }}
          # Images live in this repository owner's GHCR namespace instead of `neondatabase`
          # ghcr.io/neondatabase/compute-node-${{ matrix.version.pg }}:${{ needs.meta.outputs.build-tag }}-${{ matrix.version.debian }}-${{ matrix.arch }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/compute-node-${{ matrix.version.pg }}:${{ needs.meta.outputs.build-tag }}-${{ matrix.version.debian }}-${{ matrix.arch }}

      - name: Build neon extensions test image
        if: matrix.version.pg >= 'v16'
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          build-args: |
            GIT_VERSION=${{ github.event.pull_request.head.sha || github.sha }}
            PG_VERSION=${{ matrix.version.pg }}
            BUILD_TAG=${{ needs.meta.outputs.release-tag || needs.meta.outputs.build-tag }}
            DEBIAN_VERSION=${{ matrix.version.debian }}
          attests: |
            type=provenance,mode=max
            type=sbom,generator=docker.io/docker/buildkit-syft-scanner:1
          push: true
          pull: true
          file: compute/compute-node.Dockerfile
          target: extension-tests
          # The layer cache is in DOCKER_CACHE_REGISTRY or GHCR instead of cache.neon.build, see above
          # cache-from: type=registry,ref=cache.neon.build/compute-node-${{ matrix.version.pg }}:cache-${{ matrix.version.debian }}-${{ matrix.arch }}
          cache-from: ${{ steps.cache.outputs.cache-from }}
          # Images live in this repository owner's GHCR namespace instead of `neondatabase`
          # ghcr.io/neondatabase/neon-test-extensions-${{ matrix.version.pg }}:${{needs.meta.outputs.build-tag}}-${{ matrix.version.debian }}-${{ matrix.arch }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/neon-test-extensions-${{ matrix.version.pg }}:${{needs.meta.outputs.build-tag}}-${{ matrix.version.debian }}-${{ matrix.arch }}

  compute-node-image:
    # Also needs the Postgres versions selected by the `pg-versions` job
    # needs: [ compute-node-image-arch, meta ]
    needs: [ compute-node-image-arch, meta, pg-versions ]
    # Also for manual runs (run-kind `workflow-dispatch`), and for release PRs of all components
    # (`rc/release-all/*`, see release.yml), which release compute too
    # if: ${{ contains(fromJSON('["push-main", "pr", "compute-rc-pr"]'), needs.meta.outputs.run-kind) }}
    if: ${{ contains(fromJSON('["push-main", "pr", "workflow-dispatch", "compute-rc-pr"]'), needs.meta.outputs.run-kind) || (needs.meta.outputs.run-kind == 'storage-rc-pr' && startsWith(github.head_ref, 'rc/release-all/')) }}
    permissions:
      # No OIDC token needed: this fork has no access to AWS/Azure
      # id-token: write # aws-actions/configure-aws-credentials
      statuses: write
      contents: read
      packages: write
    runs-on: ubuntu-22.04

    strategy:
      matrix:
        # see the comment for `compute-node-image-arch` job
        # version:
        #   # see the comment for `compute-node-image-arch` job
        #   - pg: v14
        #     debian: bullseye
        #   - pg: v15
        #     debian: bullseye
        #   - pg: v16
        #     debian: bullseye
        #   - pg: v17
        #     debian: bookworm
        version: ${{ fromJSON(needs.pg-versions.outputs.compute) }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@4d991eb9b905ef189e4c376166672c3f2f230481 # v2.11.0
        with:
          egress-policy: audit

      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch compute-node image
        run: |
          # Images live in this repository owner's GHCR namespace instead of `neondatabase`
          # docker buildx imagetools create -t ghcr.io/neondatabase/compute-node-${{ matrix.version.pg }}:${{ needs.meta.outputs.build-tag }} \
          #                                 -t ghcr.io/neondatabase/compute-node-${{ matrix.version.pg }}:${{ needs.meta.outputs.build-tag }}-${{ matrix.version.debian }} \
          #                                    ghcr.io/neondatabase/compute-node-${{ matrix.version.pg }}:${{ needs.meta.outputs.build-tag }}-${{ matrix.version.debian }}-x64 \
          #                                    ghcr.io/neondatabase/compute-node-${{ matrix.version.pg }}:${{ needs.meta.outputs.build-tag }}-${{ matrix.version.debian }}-arm64
          docker buildx imagetools create -t ghcr.io/${{ github.repository_owner }}/compute-node-${{ matrix.version.pg }}:${{ needs.meta.outputs.build-tag }} \
                                          -t ghcr.io/${{ github.repository_owner }}/compute-node-${{ matrix.version.pg }}:${{ needs.meta.outputs.build-tag }}-${{ matrix.version.debian }} \
                                             ghcr.io/${{ github.repository_owner }}/compute-node-${{ matrix.version.pg }}:${{ needs.meta.outputs.build-tag }}-${{ matrix.version.debian }}-x64 \
                                             ghcr.io/${{ github.repository_owner }}/compute-node-${{ matrix.version.pg }}:${{ needs.meta.outputs.build-tag }}-${{ matrix.version.debian }}-arm64

      - name: Create multi-arch neon-test-extensions image
        if: matrix.version.pg >= 'v16'
        run: |
          # Images live in this repository owner's GHCR namespace instead of `neondatabase`
          # docker buildx imagetools create -t ghcr.io/neondatabase/neon-test-extensions-${{ matrix.version.pg }}:${{ needs.meta.outputs.build-tag }} \
          #                                 -t ghcr.io/neondatabase/neon-test-extensions-${{ matrix.version.pg }}:${{ needs.meta.outputs.build-tag }}-${{ matrix.version.debian }} \
          #                                    ghcr.io/neondatabase/neon-test-extensions-${{ matrix.version.pg }}:${{ needs.meta.outputs.build-tag }}-${{ matrix.version.debian }}-x64 \
          #                                    ghcr.io/neondatabase/neon-test-extensions-${{ matrix.version.pg }}:${{ needs.meta.outputs.build-tag }}-${{ matrix.version.debian }}-arm64
          docker buildx imagetools create -t ghcr.io/${{ github.repository_owner }}/neon-test-extensions-${{ matrix.version.pg }}:${{ needs.meta.outputs.build-tag }} \
                                          -t ghcr.io/${{ github.repository_owner }}/neon-test-extensions-${{ matrix.version.pg }}:${{ needs.meta.outputs.build-tag }}-${{ matrix.version.debian }} \
                                             ghcr.io/${{ github.repository_owner }}/neon-test-extensions-${{ matrix.version.pg }}:${{ needs.meta.outputs.build-tag }}-${{ matrix.version.debian }}-x64 \
                                             ghcr.io/${{ github.repository_owner }}/neon-test-extensions-${{ matrix.version.pg }}:${{ needs.meta.outputs.build-tag }}-${{ matrix.version.debian }}-arm64

  vm-compute-node-image-arch:
    # Upstream's self-hosted runner labels; here runners come from the RUNNER_* repository variables (see .github/actionlint.yml)
    # Also needs the Postgres versions selected by the `pg-versions` job
    # needs: [ check-permissions, meta, compute-node-image ]
    needs: [ check-permissions, meta, pg-versions, compute-node-image ]
    # Also for manual runs (run-kind `workflow-dispatch`), and for release PRs of all components
    # (`rc/release-all/*`, see release.yml), which release compute too
    # if: ${{ contains(fromJSON('["push-main", "pr", "compute-rc-pr"]'), needs.meta.outputs.run-kind) }}
    if: ${{ contains(fromJSON('["push-main", "pr", "workflow-dispatch", "compute-rc-pr"]'), needs.meta.outputs.run-kind) || (needs.meta.outputs.run-kind == 'storage-rc-pr' && startsWith(github.head_ref, 'rc/release-all/')) }}
    # Upstream's self-hosted runner labels; here runners come from the RUNNER_* repository variables (see .github/actionlint.yml)
    # runs-on: ${{ fromJSON(format('["self-hosted", "{0}"]', matrix.arch == 'arm64' && 'large-arm64' || 'large')) }}
    runs-on: ${{ matrix.arch == 'arm64' && (startsWith(vars.RUNNER_LARGE_ARM64, '[') && fromJSON(vars.RUNNER_LARGE_ARM64) || vars.RUNNER_LARGE_ARM64 || 'ubuntu-22.04-arm') || (startsWith(vars.RUNNER_LARGE, '[') && fromJSON(vars.RUNNER_LARGE) || vars.RUNNER_LARGE || 'ubuntu-22.04') }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        arch: [ amd64, arm64 ]
        # see the comment for `compute-node-image-arch` job
        # version:
        #   - pg: v14
        #     debian: bullseye
        #   - pg: v15
        #     debian: bullseye
        #   - pg: v16
        #     debian: bullseye
        #   - pg: v17
        #     debian: bookworm
        version: ${{ fromJSON(needs.pg-versions.outputs.compute) }}
    env:
      VM_BUILDER_VERSION: v0.46.0

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@4d991eb9b905ef189e4c376166672c3f2f230481 # v2.11.0
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Downloading vm-builder
        run: |
          curl -fL https://github.com/neondatabase/autoscaling/releases/download/$VM_BUILDER_VERSION/vm-builder-${{ matrix.arch }} -o vm-builder
          chmod +x vm-builder

      # Only needed on Neon's shared self-hosted runners; the default Docker config directory is used here
      # - uses: neondatabase/dev-actions/set-docker-config-dir@6094485bf440001c94a94a3f9e221e81ff6b6193
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Nothing outside a PR run uses its VM images: push-compute-image-dev has no tag to add for a PR. So on PRs,
      # with the DOCKER_CACHE_REGISTRY repository variable set, they go to that registry, next to the runners, instead
      # of GHCR (and vm-compute-node-image skips the multi-arch image). Runs whose images get tagged and released
      # (main, release PRs, manual runs) keep pushing them to GHCR.
      - name: Pick the registry for the VM image
        id: vm-registry
        uses: ./.github/actions/docker-cache-registry
        with:
          cache-registry: ${{ needs.meta.outputs.run-kind == 'pr' && vars.DOCKER_CACHE_REGISTRY || '' }}

      # Note: we need a separate pull step here because otherwise vm-builder will try to pull, and
      # it won't have the proper authentication (written at v0.6.0)
      - name: Pulling compute-node image
        run: |
          # Images live in this repository owner's GHCR namespace instead of `neondatabase`
          # docker pull ghcr.io/neondatabase/compute-node-${{ matrix.version.pg }}:${{ needs.meta.outputs.build-tag }}
          docker pull ghcr.io/${{ github.repository_owner }}/compute-node-${{ matrix.version.pg }}:${{ needs.meta.outputs.build-tag }}

      - name: Build vm image
        # Images are pushed to this repository owner's GHCR namespace instead of `neondatabase`; upstream's:
        #   -src=ghcr.io/neondatabase/compute-node-${{ matrix.version.pg }}:${{ needs.meta.outputs.build-tag }} \
        #   -dst=ghcr.io/neondatabase/vm-compute-node-${{ matrix.version.pg }}:${{ needs.meta.outputs.build-tag }}-${{ matrix.arch }} \
        run: |
          ./vm-builder \
            -size=2G \
            -spec=compute/vm-image-spec-${{ matrix.version.debian }}.yaml \
            -src=ghcr.io/${{ github.repository_owner }}/compute-node-${{ matrix.version.pg }}:${{ needs.meta.outputs.build-tag }} \
            -dst=${{ steps.vm-registry.outputs.registry }}/vm-compute-node-${{ matrix.version.pg }}:${{ needs.meta.outputs.build-tag }}-${{ matrix.arch }} \
            -target-arch=linux/${{ matrix.arch }}

      - name: Pushing vm-compute-node image
        run: |
          # Images live in this repository owner's GHCR namespace (or DOCKER_CACHE_REGISTRY, see above) instead of `neondatabase`
          # docker push ghcr.io/neondatabase/vm-compute-node-${{ matrix.version.pg }}:${{ needs.meta.outputs.build-tag }}-${{ matrix.arch }}
          docker push ${{ steps.vm-registry.outputs.registry }}/vm-compute-node-${{ matrix.version.pg }}:${{ needs.meta.outputs.build-tag }}-${{ matrix.arch }}

  vm-compute-node-image:
    # Also needs the Postgres versions selected by the `pg-versions` job
    # needs: [ vm-compute-node-image-arch, meta ]
    needs: [ vm-compute-node-image-arch, meta, pg-versions ]
    # Also for manual runs (run-kind `workflow-dispatch`), and for release PRs of all components
    # (`rc/release-all/*`, see release.yml), which release compute too
    # if: ${{ contains(fromJSON('["push-main", "pr", "compute-rc-pr"]'), needs.meta.outputs.run-kind) }}
    # Not for PRs whose VM images went to DOCKER_CACHE_REGISTRY (see vm-compute-node-image-arch): nothing uses a PR's
    # multi-arch VM image, and this GitHub-hosted job can't log in there.
    if: >-
      ${{
        (contains(fromJSON('["push-main", "pr", "workflow-dispatch", "compute-rc-pr"]'), needs.meta.outputs.run-kind) || (needs.meta.outputs.run-kind == 'storage-rc-pr' && startsWith(github.head_ref, 'rc/release-all/')))
        && !(needs.meta.outputs.run-kind == 'pr' && vars.DOCKER_CACHE_REGISTRY != '')
      }}
    permissions:
      packages: write
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        # see the comment for `compute-node-image-arch` job
        # version:
        #   # see the comment for `compute-node-image-arch` job
        #   - pg: v14
        #   - pg: v15
        #   - pg: v16
        #   - pg: v17
        version: ${{ fromJSON(needs.pg-versions.outputs.compute) }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@4d991eb9b905ef189e4c376166672c3f2f230481 # v2.11.0
        with:
          egress-policy: audit

      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch compute-node image
        run: |
          # Images live in this repository owner's GHCR namespace instead of `neondatabase`
          # docker buildx imagetools create -t ghcr.io/neondatabase/vm-compute-node-${{ matrix.version.pg }}:${{ needs.meta.outputs.build-tag }} \
          #                                    ghcr.io/neondatabase/vm-compute-node-${{ matrix.version.pg }}:${{ needs.meta.outputs.build-tag }}-amd64 \
          #                                    ghcr.io/neondatabase/vm-compute-node-${{ matrix.version.pg }}:${{ needs.meta.outputs.build-tag }}-arm64
          docker buildx imagetools create -t ghcr.io/${{ github.repository_owner }}/vm-compute-node-${{ matrix.version.pg }}:${{ needs.meta.outputs.build-tag }} \
                                             ghcr.io/${{ github.repository_owner }}/vm-compute-node-${{ matrix.version.pg }}:${{ needs.meta.outputs.build-tag }}-amd64 \
                                             ghcr.io/${{ github.repository_owner }}/vm-compute-node-${{ matrix.version.pg }}:${{ needs.meta.outputs.build-tag }}-arm64


  test-images:
    # Also needs the Postgres versions selected by the `pg-versions` job
    # needs: [ check-permissions, meta, neon-image, compute-node-image ]
    needs: [ check-permissions, meta, pg-versions, neon-image, compute-node-image ]
    # Depends on jobs that can get skipped
    # Also runs for manually dispatched runs (`workflow-dispatch`); upstream's run-kind check:
    #   && contains(fromJSON('["push-main", "pr", "storage-rc-pr", "proxy-rc-pr", "compute-rc-pr"]'), needs.meta.outputs.run-kind)
    if: >-
      ${{
        !failure()
        && !cancelled()
        && contains(fromJSON('["push-main", "pr", "workflow-dispatch", "storage-rc-pr", "proxy-rc-pr", "compute-rc-pr"]'), needs.meta.outputs.run-kind)
        && needs.pg-versions.outputs.test-extensions != '[]'
      }}
    strategy:
      fail-fast: false
      matrix:
        arch: [ x64, arm64 ]
        # v16 and v17, if selected: see the `pg-versions` job
        # pg_version: [v16, v17]
        pg_version: ${{ fromJSON(needs.pg-versions.outputs.test-extensions) }}

    permissions:
      packages: read

    # Upstream's self-hosted runner labels; here runners come from the RUNNER_* repository variables (see .github/actionlint.yml)
    # runs-on: ${{ fromJSON(format('["self-hosted", "{0}"]', matrix.arch == 'arm64' && 'small-arm64' || 'small')) }}
    runs-on: ${{ matrix.arch == 'arm64' && (startsWith(vars.RUNNER_SMALL_ARM64, '[') && fromJSON(vars.RUNNER_SMALL_ARM64) || vars.RUNNER_SMALL_ARM64 || 'ubuntu-22.04-arm') || (startsWith(vars.RUNNER_SMALL, '[') && fromJSON(vars.RUNNER_SMALL) || vars.RUNNER_SMALL || 'ubuntu-22.04') }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@4d991eb9b905ef189e4c376166672c3f2f230481 # v2.11.0
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Only needed on Neon's shared self-hosted runners; the default Docker config directory is used here
      # - uses: neondatabase/dev-actions/set-docker-config-dir@6094485bf440001c94a94a3f9e221e81ff6b6193
      # - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
      #   with:
      #     username: ${{ secrets.NEON_DOCKERHUB_USERNAME }}
      #     password: ${{ secrets.NEON_DOCKERHUB_PASSWORD }}

      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `ghcr.io/neondatabase/neon` contains multiple binaries, all of them use the same input for the version into the same version formatting library.
      # Pick pageserver as currently the only binary with extra "version" features printed in the string to verify.
      # Regular pageserver version string looks like
      #   Neon page server git-env:32d14403bd6ab4f4520a94cbfd81a6acef7a526c failpoints: true, features: []
      # Bad versions might loop like:
      #   Neon page server git-env:local failpoints: true, features: ["testing"]
      # Ensure that we don't have bad versions.
      - name: Verify image versions
        shell: bash # ensure no set -e for better error messages
        # Also for manual runs (run-kind `workflow-dispatch`)
        # if: ${{ contains(fromJSON('["push-main", "pr", "storage-rc-pr", "proxy-rc-pr"]'), needs.meta.outputs.run-kind) }}
        if: ${{ contains(fromJSON('["push-main", "pr", "workflow-dispatch", "storage-rc-pr", "proxy-rc-pr"]'), needs.meta.outputs.run-kind) }}
        run: |
          # Images live in this repository owner's GHCR namespace instead of `neondatabase`
          # pageserver_version=$(docker run --rm ghcr.io/neondatabase/neon:${{ needs.meta.outputs.build-tag }} "/bin/sh" "-c" "/usr/local/bin/pageserver --version")
          pageserver_version=$(docker run --rm ghcr.io/${{ github.repository_owner }}/neon:${{ needs.meta.outputs.build-tag }} "/bin/sh" "-c" "/usr/local/bin/pageserver --version")

          echo "Pageserver version string: $pageserver_version"

          if ! echo "$pageserver_version" | grep -qv 'git-env:local' ; then
            echo "Pageserver version should not be the default Dockerfile one"
            exit 1
          fi

          if ! echo "$pageserver_version" | grep -qv '"testing"' ; then
            echo "Pageserver version should have no testing feature enabled"
            exit 1
          fi

      # docker-compose.yml bind-mounts docker-compose/pageserver_config as the pageserver's data directory,
      # and the neon image runs as `neon` (uid 1000): let it create its files there, as this fork's runners
      # run as uid 1001.
      - name: Make the pageserver's data directory writable
        run: chmod a+w docker-compose/pageserver_config

      - name: Verify docker-compose example and test extensions
        timeout-minutes: 60
        env:
          PARALLEL_COMPUTES: 3
          TAG: >-
            ${{
              needs.meta.outputs.run-kind == 'compute-rc-pr'
              && needs.meta.outputs.previous-storage-release
              || needs.meta.outputs.build-tag
            }}
          COMPUTE_TAG: >-
            ${{
              contains(fromJSON('["storage-rc-pr", "proxy-rc-pr"]'), needs.meta.outputs.run-kind)
              && needs.meta.outputs.previous-compute-release
              || needs.meta.outputs.build-tag
            }}
          TEST_EXTENSIONS_TAG: >-
            ${{
              contains(fromJSON('["storage-rc-pr", "proxy-rc-pr"]'), needs.meta.outputs.run-kind)
              && needs.meta.outputs.previous-compute-release
              || needs.meta.outputs.build-tag
            }}
          TEST_VERSION_ONLY: ${{ matrix.pg_version }}
          # docker-compose.yml defaults to ghcr.io/neondatabase
          REPOSITORY: ghcr.io/${{ github.repository_owner }}
        run: ./docker-compose/docker_compose_test.sh

      - name: Print logs and clean up docker-compose test
        if: always()
        run: |
          docker compose --profile test-extensions -f ./docker-compose/docker-compose.yml logs || true
          docker compose --profile test-extensions -f ./docker-compose/docker-compose.yml down

      - name: Test extension upgrade
        timeout-minutes: 20
        # Needs a previous compute release to upgrade from, which this fork may not have (yet)
        # Also for manual runs (run-kind `workflow-dispatch`)
        # if: ${{ contains(fromJSON('["pr", "compute-rc-pr"]'), needs.meta.outputs.run-kind) }}
        if: ${{ contains(fromJSON('["pr", "workflow-dispatch", "compute-rc-pr"]'), needs.meta.outputs.run-kind) && needs.meta.outputs.previous-compute-release != '' }}
        env:
          # Also for manually dispatched runs (`workflow-dispatch`); upstream's:
          #   || needs.meta.outputs.run-kind == 'pr' && needs.meta.outputs.build-tag
          TAG: >-
            ${{
              false
              || contains(fromJSON('["pr", "workflow-dispatch"]'), needs.meta.outputs.run-kind) && needs.meta.outputs.build-tag
              || needs.meta.outputs.run-kind == 'compute-rc-pr' && needs.meta.outputs.previous-storage-release
            }}
          TEST_EXTENSIONS_TAG: ${{ needs.meta.outputs.previous-compute-release }}
          NEW_COMPUTE_TAG: ${{ needs.meta.outputs.build-tag }}
          OLD_COMPUTE_TAG: ${{ needs.meta.outputs.previous-compute-release }}
          REPOSITORY: ghcr.io/${{ github.repository_owner }}
        run: ./docker-compose/test_extensions_upgrade.sh

      - name: Print logs and clean up
        if: always()
        run: |
          docker compose --profile test-extensions -f ./docker-compose/docker-compose.yml logs || true
          docker compose --profile test-extensions -f ./docker-compose/docker-compose.yml down

