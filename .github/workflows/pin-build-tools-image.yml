name: 'Pin build-tools image'

on:
  workflow_dispatch:
    inputs:
      from-tag:
        description: 'Source tag'
        required: true
        type: string
      force:
        description: 'Force the image to be pinned'
        default: false
        type: boolean
  workflow_call:
    inputs:
      from-tag:
        description: 'Source tag'
        required: true
        type: string
      force:
        description: 'Force the image to be pinned'
        default: false
        type: boolean

defaults:
  run:
    shell: bash -euo pipefail {0}

concurrency:
  group: pin-build-tools-image-${{ inputs.from-tag }}
  cancel-in-progress: false

# No permission for GITHUB_TOKEN by default; the **minimal required** set of permissions should be granted in each job.
permissions: {}

jobs:
  check-manifests:
    runs-on: ${{ vars.RUNNER_DEFAULT || 'ubuntu-22.04' }}
    outputs:
      skip: ${{ steps.check-manifests.outputs.skip }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0 # v2.12.0
        with:
          egress-policy: audit

      - name: Check if we really need to pin the image
        id: check-manifests
        env:
          IMAGE_REPO: ghcr.io/${{ github.repository_owner }}/build-tools
          FROM_TAG: ${{ inputs.from-tag }}
          TO_TAG: pinned
        run: |
          docker manifest inspect "${IMAGE_REPO}:${FROM_TAG}" > "${FROM_TAG}.json"
          docker manifest inspect "${IMAGE_REPO}:${TO_TAG}"   > "${TO_TAG}.json"

          if diff "${FROM_TAG}.json" "${TO_TAG}.json"; then
            skip=true
          else
            skip=false
          fi

          echo "skip=${skip}" | tee -a $GITHUB_OUTPUT

  tag-image:
    needs: check-manifests

    # use format(..) to catch both inputs.force = true AND inputs.force = 'true'
    if: needs.check-manifests.outputs.skip == 'false' || format('{0}', inputs.force) == 'true'

    permissions:
      packages: write  # required for pushing to GHCR

    uses: ./.github/workflows/_push-to-container-registry.yml
    with:
      image-map: |
        {
          "ghcr.io/${{ github.repository_owner }}/build-tools:${{ inputs.from-tag }}-bullseye": [
            "ghcr.io/${{ github.repository_owner }}/build-tools:pinned-bullseye"
          ],
          "ghcr.io/${{ github.repository_owner }}/build-tools:${{ inputs.from-tag }}-bookworm": [
            "ghcr.io/${{ github.repository_owner }}/build-tools:pinned-bookworm",
            "ghcr.io/${{ github.repository_owner }}/build-tools:pinned"
          ]
        }
    secrets: inherit
